<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(99, 102, 241, 0.08);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        body.dark-theme {
            --bg-color: #090d16;
            --card-bg: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
            --accent-color: #818cf8;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 75px;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .nav-brand {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .nav-brand span {
            color: var(--accent-color);
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .content-area {
            padding: 0 20px;
            flex: 1;
        }

        .brand-section {
            text-align: center;
            margin: 20px 0 24px 0;
        }

        .main-logo {
            font-size: 2.5rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .sub-text {
            color: var(--text-secondary);
            font-size: 0.82rem;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Search Bar */
        .search-section {
            position: relative;
            margin-bottom: 18px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 12px 18px;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
        }

        .search-bar:focus-within {
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-color);
        }

        .search-icon {
            font-size: 1.1rem;
            margin-right: 10px;
            opacity: 0.6;
        }

        #searchInput {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95rem;
            width: 100%;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.05rem;
            padding: 2px;
            margin-left: 8px;
            color: var(--text-secondary);
        }

        /* Suggestions */
        .suggestions-box {
            position: absolute;
            top: 110%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            list-style: none;
            z-index: 100;
            overflow: hidden;
        }

        .suggestions-box li {
            padding: 12px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .suggestions-box li:last-child {
            border-bottom: none;
        }

        /* Tabs */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar { display: none; }

        .tab-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-chip.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Feed & Result Cards */
        .feed-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .feed-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s ease;
        }

        .feed-source {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .feed-source img {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .feed-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
            text-decoration: none;
        }

        .feed-title:hover {
            color: var(--accent-color);
        }

        .feed-snippet {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .video-box {
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            box-shadow: var(--shadow-md);
        }

        .video-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 60px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            color: var(--text-primary);
            padding: 8px;
        }

        .nav-item.active { opacity: 1; color: var(--accent-color); }

        .nav-item.center-ai {
            background: var(--accent-gradient);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            opacity: 1;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            margin-top: -16px;
        }
    </style>
</head>
<body class="light-theme">

    <div class="app-container">
        <header class="app-header">
            <div class="nav-brand">wareligent<span>.search</span></div>
            <button id="themeToggleBtn" class="icon-btn">🌙</button>
        </header>

        <main class="content-area">
            <div class="brand-section">
                <h1 class="main-logo">wareligent</h1>
                <p class="sub-text">Smart & Private Search Engine</p>
            </div>

            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search web, news, videos..." autocomplete="off">
                    <button id="clearBtn" class="action-btn" style="display: none;">✕</button>
                </div>
                <ul id="suggestionsList" class="suggestions-box"></ul>
            </div>

            <div class="category-tabs" id="categoryTabs">
                <button class="tab-chip active" data-type="all">🌐 All Web</button>
                <button class="tab-chip" data-type="news">📰 Live News</button>
                <button class="tab-chip" data-type="videos">▶ YouTube</button>
            </div>

            <div id="resultsWrapper" class="feed-section"></div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="resetToHome()">🏠</button>
            <button class="nav-item center-ai" onclick="document.getElementById('searchInput').focus()">✨</button>
            <button class="nav-item" onclick="document.getElementById('themeToggleBtn').click()">⚙️</button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = "https://xveccsbdrysuiwyuvodw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCategory = "all";

        document.addEventListener('DOMContentLoaded', () => { 
            loadTrendingNews();
        });

        // 1. হোম পেজ নিউজ ফিড
        async function loadTrendingNews() {
            const resultsWrapper = document.getElementById('resultsWrapper');
            resultsWrapper.innerHTML = `<p style="color: var(--text-secondary); text-align: center; font-size:0.85rem; padding: 20px;">Trending news loading...</p>`;
            
            try {
                const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=technology%20trends&format=json&origin=*`);
                const data = await res.json();
                resultsWrapper.innerHTML = '';

                if (data.query && data.query.search.length > 0) {
                    data.query.search.slice(0, 5).forEach(item => {
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.innerHTML = `
                            <div class="feed-source">
                                <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=32" alt="">
                                <span>Trending News</span>
                            </div>
                            <a class="feed-title" href="https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}" target="_blank">${item.title}</a>
                            <p class="feed-snippet">${cleanSnippet}...</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });
                }
            } catch (e) {
                resultsWrapper.innerHTML = `<p style="text-align: center; color: var(--text-secondary);">Could not load trends.</p>`;
            }
        }

        // 2. সার্চ হ্যান্ডলার
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestionsList = document.getElementById('suggestionsList');

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query ? 'block' : 'none';
            if (!query) { suggestionsList.innerHTML = ''; return; }
            fetchSuggestions(query);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                suggestionsList.innerHTML = '';
                executeSearch();
            }
        });

        function resetToHome() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsList.innerHTML = '';
            loadTrendingNews();
        }

        function fetchSuggestions(query) {
            const oldScript = document.getElementById('jsonp-suggestions');
            if (oldScript) oldScript.remove();

            window.handleGoogleSuggestions = (data) => {
                suggestionsList.innerHTML = '';
                if (data && data[1]) {
                    data[1].slice(0, 5).forEach((term) => {
                        const li = document.createElement('li');
                        li.innerHTML = `<span>🔍</span> ${term}`;
                        li.onclick = () => {
                            searchInput.value = term;
                            suggestionsList.innerHTML = '';
                            executeSearch(term);
                        };
                        suggestionsList.appendChild(li);
                    });
                }
            };

            const script = document.createElement('script');
            script.id = 'jsonp-suggestions';
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleGoogleSuggestions`;
            document.body.appendChild(script);
        }

        // 3. ট্যাব সিলেকশন
        const tabChips = document.querySelectorAll('.tab-chip');
        tabChips.forEach(chip => {
            chip.addEventListener('click', function() {
                tabChips.forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.type;
                if (searchInput.value.trim()) executeSearch();
            });
        });

        // 4. প্রধান সার্চ ইঞ্জিন লজিক (In-App Search)
        async function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            const resultsWrapper = document.getElementById('resultsWrapper');
            resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px; color: var(--text-secondary);">Searching Wareligent...</p>`;

            // কাস্টম ইউটিউব ক্যাটাগরি
            if (currentCategory === "videos") {
                resultsWrapper.innerHTML = `
                    <div class="video-box">
                        <iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}" allowfullscreen></iframe>
                    </div>
                `;
                return;
            }

            try {
                // ১. প্রথম চেষ্টা: Supabase DB থেকে সার্চ করা
                let { data: dbResults } = await supabaseClient
                    .from('websites')
                    .select('*')
                    .or(`title.ilike.%${query}%,keywords.ilike.%${query}%,description.ilike.%${query}%`)
                    .limit(6);

                resultsWrapper.innerHTML = '';

                if (dbResults && dbResults.length > 0) {
                    dbResults.forEach(site => {
                        let domain = site.url;
                        try { domain = new URL(site.url).hostname; } catch(e){}

                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.innerHTML = `
                            <div class="feed-source">
                                <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="">
                                <span>${domain}</span>
                            </div>
                            <a href="${site.url}" target="_blank" class="feed-title">${site.title}</a>
                            <p class="feed-snippet">${site.description || ''}</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });
                } else {
                    // ২. দ্বিতীয় চেষ্টা (DB-তে না থাকলে): অ্যাপের ভেতরেই Live Web API Results দেখানো
                    await fetchLiveWebResults(query);
                }
            } catch (err) {
                await fetchLiveWebResults(query);
            }
        }

        // Live API Fallback (অন্য ইঞ্জিনে না পাঠিয়ে অ্যাপের ভেতরেই রেজাল্ট দেখানো)
        async function fetchLiveWebResults(query) {
            const resultsWrapper = document.getElementById('resultsWrapper');
            try {
                const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
                const data = await res.json();
                resultsWrapper.innerHTML = '';

                if (data.query && data.query.search.length > 0) {
                    data.query.search.forEach(item => {
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const itemUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}`;
                        
                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.innerHTML = `
                            <div class="feed-source">
                                <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=32" alt="">
                                <span>Live Web Result</span>
                            </div>
                            <a class="feed-title" href="${itemUrl}" target="_blank">${item.title}</a>
                            <p class="feed-snippet">${cleanSnippet}...</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });
                } else {
                    resultsWrapper.innerHTML = `<p style="text-align: center; color: var(--text-secondary); padding: 20px;">No results found for "${query}".</p>`;
                }
            } catch (e) {
                resultsWrapper.innerHTML = `<p style="text-align: center; color: var(--text-secondary); padding: 20px;">Failed to fetch results.</p>`;
            }
        }

        // থিম টগল
        document.getElementById('themeToggleBtn').onclick = () => {
            document.body.classList.toggle('dark-theme');
            document.body.classList.toggle('light-theme');
            document.getElementById('themeToggleBtn').textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        };
    </script>
</body>
</html>
