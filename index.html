<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Wareligent Search — Discover the web.">
<title>Wareligent Search</title>
<link rel="icon" href="logo.png" type="image/png">

<style>
:root{
--blue:#2868e8;--ink:#202124;--muted:#70757a;
--line:#e5e8ee;--bg:#fff;--soft:#f5f8ff;--card:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
a{text-decoration:none;color:inherit}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #f0f1f4}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800}
.brand img{width:34px;height:34px;object-fit:contain}
.brand span span,.logo-word span{color:var(--blue)}
.top-actions{display:flex;gap:10px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--card);cursor:pointer;transition:.25s}
.icon-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px)}
.main{max-width:980px;margin:auto;padding:90px 22px 55px}
.hero{text-align:center}
.logo-large{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}
.logo-large img{width:56px;height:56px;object-fit:contain}
.logo-word{font-size:clamp(38px,7vw,60px);font-weight:800;letter-spacing:-3px}
.tagline{font-size:14px;color:var(--muted);margin-bottom:30px}
.search-wrap{max-width:690px;margin:auto;position:relative}
.search-box{height:58px;border:1px solid #dfe3eb;border-radius:40px;display:flex;align-items:center;padding:0 17px 0 21px;gap:13px;background:var(--card);box-shadow:0 3px 14px #1e32500b;transition:.25s}
.search-box:focus-within{border-color:#a9c3fa;box-shadow:0 5px 24px #2868e822}
.search-icon{color:#8b929e;font-size:22px}
.search-box input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--ink);font-size:16px}
.clear-btn{border:0;background:none;color:#8b929e;font-size:22px;cursor:pointer;display:none}
.search-actions{display:flex;justify-content:center;gap:12px;margin:24px 0 15px}
.outline-btn{border:1px solid #dce2ed;background:var(--card);color:#394150;padding:11px 19px;border-radius:8px;cursor:pointer;font-size:13px;transition:.25s}
.outline-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-3px)}
.quick-links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:30px auto}
.quick-link{border:1px solid var(--line);border-radius:30px;padding:9px 15px;color:#626b79;font-size:12px;cursor:pointer;background:var(--card)}
.quick-link:hover{color:var(--blue);border-color:#b8cdf9}
.suggestions{display:none;position:absolute;top:64px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 40px #20376417;z-index:20;padding:8px;text-align:left}
.suggestions.show{display:block}
.suggestion{display:flex;gap:12px;padding:11px 13px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:14px}
.suggestion:hover{background:var(--soft)}
.results-area{display:none;max-width:850px;margin:42px auto 0}
.results-area.show{display:block}
.results-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:22px}
.result-tabs{display:flex;gap:7px;overflow-x:auto}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:22px;cursor:pointer;font-size:13px;white-space:nowrap}
.tab.active,.tab:hover{background:#edf3ff;color:var(--blue)}
.result-meta{font-size:12px;color:var(--muted)}
.result{padding:15px 0 20px;max-width:690px}
.result-url{font-size:12px;color:#5d6878;margin-bottom:7px;overflow-wrap:anywhere}
.result h3{font-size:20px;font-weight:500;color:#1558c9;margin:0 0 7px;line-height:1.35}
.result h3 a:hover{text-decoration:underline}
.result p{font-size:14px;line-height:1.65;color:#5c626c;margin:0}
.result-label{display:inline-block;margin-top:9px;color:#778196;font-size:11px;background:#f3f5f8;padding:4px 8px;border-radius:5px}
.empty{text-align:center;padding:55px 15px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:9px}
.loader{display:none;text-align:center;padding:30px;color:var(--muted);font-size:13px}
.loader.show{display:block}
.spinner{width:25px;height:25px;border:3px solid #e5ecfb;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.pagination{display:flex;justify-content:center;gap:8px;margin:25px}
.page-btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:8px;cursor:pointer}
.page-btn.active{background:var(--blue);color:white}
.footer{padding:25px 5%;border-top:1px solid #f0f1f4;color:#858b96;font-size:12px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
.footer-links{display:flex;gap:18px;flex-wrap:wrap}
.footer a:hover{color:var(--blue)}
.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#202938;color:white;padding:11px 17px;border-radius:30px;font-size:12px;opacity:0;pointer-events:none;transition:.3s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.dark{--ink:#eef2f9;--muted:#a1aabb;--line:#303a4b;--bg:#111722;--card:#192231;--soft:#202e45}
body.dark .topbar,body.dark .footer{border-color:#263142}
body.dark .result h3{color:#82adff}
body.dark .result p{color:#b2bdcc}
body.dark .outline-btn{color:#d4dceb}
body.dark .result-label{background:#263247;color:#aab9d0}
body.dark .search-box{border-color:#364357}

@media(max-width:600px){
.topbar{height:60px;padding:0 17px}
.brand{font-size:18px}
.brand img{width:30px;height:30px}
.main{padding:95px 17px 45px}
.logo-large img{width:45px;height:45px}
.logo-word{letter-spacing:-2px}
.tagline{font-size:13px}
.search-box{height:54px;padding:0 14px}
.search-box input{font-size:15px}
.search-actions{margin-top:19px}
.outline-btn{padding:10px 15px}
.results-area{margin-top:30px}
.result h3{font-size:18px}
.footer{padding:22px 18px}
}

</style>
</head>
<body>

<header class="topbar">
<a class="brand" href="./">
<img src="logo.png" alt="Wareligent logo">
<span>wareligent<span>.</span></span>
</a>
<div class="top-actions">
<button class="icon-btn" id="historyBtn" title="Recent searches">◷</button>
<button class="icon-btn" id="themeBtn" title="Toggle theme">☾</button>
</div>
</header>

<main class="main">
<section class="hero" id="home">

<div class="logo-large">
<img src="logo.png" alt="">
<div class="logo-word">wareligent<span>.</span></div>
</div>

<p class="tagline">Search. Discover. Explore.</p>

<div class="search-wrap">
<form class="search-box" id="searchForm" autocomplete="off">
<span class="search-icon">⌕</span>
<input id="searchInput" type="search" placeholder="Search the web..." aria-label="Search the web">
<button type="button" class="clear-btn" id="clearBtn">×</button>
<button type="submit" class="icon-btn" style="color:var(--blue)">→</button>
</form>
<div class="suggestions" id="suggestions"></div>
</div>

<div class="search-actions">
<button class="outline-btn" id="searchBtn">Wareligent Search</button>
<button class="outline-btn" id="luckyBtn">I'm Feeling Curious</button>
</div>

<div class="quick-links">
<button class="quick-link" data-query="Latest technology news">✦ Technology</button>
<button class="quick-link" data-query="World news today">▤ News</button>
<button class="quick-link" data-query="Science and innovation">◎ Science</button>
<button class="quick-link" data-query="Learn programming">⌘ Programming</button>
</div>

</section>

<section class="results-area" id="resultsArea">
<div class="results-top">
<div class="result-tabs">
<button class="tab active" data-type="web">All</button>
<button class="tab" data-type="images">Images</button>
<button class="tab" data-type="news">News</button>
<button class="tab" data-type="videos">Videos</button>
<button class="tab" data-type="maps">Maps</button>
</div>
<div class="result-meta" id="resultMeta"></div>
</div>
<div class="loader" id="loader">
<div class="spinner"></div>Searching Wareligent...
</div>
<div id="resultsList"></div>
<div class="pagination" id="pagination"></div>
</section>
</main>

<footer class="footer">
<span>© <span id="year"></span> Wareligent. All rights reserved.</span>
<div class="footer-links">
<a href="https://wareligent.vercel.app" target="_blank">About Wareligent</a>
<a href="mailto:wareligent@gmail.com">Feedback</a>
<a href="mailto:wareligent@gmail.com">Contact</a>
</div>
</footer>

<div class="toast" id="toast"></div>

<script>
/* API CONFIGURATION */
const CONFIG={
mode:"demo",
apiEndpoint:"https://YOUR-BACKEND.example.com/search",
resultsPerPage:8,
historyLimit:8
};

const $=id=>document.getElementById(id);
const input=$('searchInput');
const suggestions=$('suggestions');
const resultsArea=$('resultsArea');
const resultsList=$('resultsList');
const loader=$('loader');
const meta=$('resultMeta');
const pagination=$('pagination');

let currentQuery='';
let currentType='web';
let currentPage=1;

function demoResults(q){
return [
{title:q+" — Overview and Information",url:"https://en.wikipedia.org/wiki/"+encodeURIComponent(q.replace(/\s+/g,"_")),description:"Explore an overview of "+q+", including background information, useful facts and related topics.",label:"Reference"},
{title:"Learn more about "+q,url:"https://www.google.com/search?q="+encodeURIComponent(q),description:"Discover useful resources, guides and information related to "+q+". This is a sample result.",label:"Web resource"},
{title:q+" — Latest Updates",url:"https://www.bing.com/search?q="+encodeURIComponent(q),description:"Find recent updates, articles and discussions about "+q+" from across the web.",label:"Discover"},
{title:"A beginner's guide to "+q,url:"https://duckduckgo.com/?q="+encodeURIComponent(q),description:"A starting point for learning about "+q+". Connect your own search provider for live results.",label:"Guide"},
{title:q+": Resources and helpful links",url:"https://search.brave.com/search?q="+encodeURIComponent(q),description:"Browse more resources and related websites about "+q+".",label:"Resources"}
];
}

function toast(message){
const t=$('toast');
t.textContent=message;
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2400);
}

function getHistory(){
try{return JSON.parse(localStorage.getItem('wareligent_history')||'[]')}
catch(e){return []}
}

function saveHistory(q){
let h=getHistory().filter(x=>x.toLowerCase()!==q.toLowerCase());
h.unshift(q);
localStorage.setItem('wareligent_history',JSON.stringify(h.slice(0,CONFIG.historyLimit)));
}

function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

function safeURL(url){
try{
const u=new URL(url);
return ['http:','https:'].includes(u.protocol)?u.href:'#';
}catch(e){return '#'}
}

function showSuggestions(){
let items=getHistory();
const q=input.value.trim();
if(q)items=[q,...items.filter(x=>x.toLowerCase().includes(q.toLowerCase()))];
items=[...new Set(items)].slice(0,6);
if(!items.length){suggestions.classList.remove('show');return}
suggestions.innerHTML=items.map(x=>
`<div class="suggestion" data-value="${escapeHTML(x)}">⌕ &nbsp; ${escapeHTML(x)}</div>`
).join('');
suggestions.classList.add('show');
}

async function fetchResults(q,type,page){
if(CONFIG.mode!=="api")return demoResults(q);
if(CONFIG.apiEndpoint.includes("YOUR-BACKEND"))throw new Error("Configure your API endpoint first.");
const response=await fetch(CONFIG.apiEndpoint,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({query:q,type,page,limit:CONFIG.resultsPerPage})
});
if(!response.ok)throw new Error("Search API error: "+response.status);
const data=await response.json();
return Array.isArray(data)?data:(data.results||[]);
}

async function runSearch(q,type="web",page=1){
q=q.trim();
if(!q){input.focus();toast("Type something to search");return}
currentQuery=q;
currentType=type;
currentPage=page;
input.value=q;
$('clearBtn').style.display="block";
suggestions.classList.remove('show');
saveHistory(q);
resultsArea.classList.add('show');
loader.classList.add('show');
resultsList.innerHTML="";
pagination.innerHTML="";
meta.textContent="";
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.type===type));

try{
const items=await fetchResults(q,type,page);
renderResults(items);
meta.textContent=CONFIG.mode==="demo"?"Demo results · API not connected":items.length+" results";
resultsArea.scrollIntoView({behavior:"smooth",block:"start"});
}catch(err){
resultsList.innerHTML=`<div class="empty"><strong>Search could not be completed</strong>${escapeHTML(err.message)}</div>`;
}finally{
loader.classList.remove('show');
}
}

function renderResults(items){
if(!items.length){
resultsList.innerHTML='<div class="empty"><strong>No results found</strong>Try different keywords.</div>';
return;
}
resultsList.innerHTML=items.map(r=>{
const title=escapeHTML(r.title||r.name||"Untitled result");
const url=safeURL(r.url||r.link||"#");
let host="Search result";
try{host=new URL(url).hostname}catch(e){}
const description=escapeHTML(r.description||r.snippet||"No description available.");
return `<article class="result">
<div class="result-url">🌐 ${escapeHTML(r.displayUrl||host)}</div>
<h3><a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a></h3>
<p>${description}</p>
${r.label?`<span class="result-label">${escapeHTML(r.label)}</span>`:""}
</article>`;
}).join('');

if(CONFIG.mode==="demo"){
pagination.innerHTML='<button class="page-btn active">1</button>';
}else if(items.length>=CONFIG.resultsPerPage){
pagination.innerHTML=`<button class="page-btn" id="prevPage">←</button><button class="page-btn active">${currentPage}</button><button class="page-btn" id="nextPage">→</button>`;
if($('prevPage'))$('prevPage').onclick=()=>runSearch(currentQuery,currentType,currentPage-1);
if($('nextPage'))$('nextPage').onclick=()=>runSearch(currentQuery,currentType,currentPage+1);
}
}

$('searchForm').addEventListener('submit',e=>{
e.preventDefault();
runSearch(input.value);
});

$('searchBtn').onclick=()=>runSearch(input.value);
$('luckyBtn').onclick=()=>{
if(!input.value.trim()){toast("Enter a search first");return}
runSearch(input.value);
};

input.addEventListener('input',()=>{
$('clearBtn').style.display=input.value?"block":"none";
showSuggestions();
});

input.addEventListener('focus',showSuggestions);

$('clearBtn').onclick=()=>{
input.value="";
$('clearBtn').style.display="none";
suggestions.classList.remove('show');
input.focus();
};

suggestions.onclick=e=>{
const row=e.target.closest('.suggestion');
if(row)runSearch(row.dataset.value);
};

document.addEventListener('click',e=>{
if(!e.target.closest('.search-wrap'))suggestions.classList.remove('show');
});

document.querySelectorAll('.quick-link').forEach(b=>{
b.onclick=()=>runSearch(b.dataset.query);
});

document.querySelectorAll('.tab').forEach(b=>{
b.onclick=()=>{
if(currentQuery)runSearch(currentQuery,b.dataset.type);
else toast("Enter a search query first");
};
});

$('historyBtn').onclick=()=>{
const h=getHistory();
if(!h.length){toast("No recent searches yet");return}
input.value=h[0];
showSuggestions();
input.focus();
};

$('themeBtn').onclick=()=>{
document.body.classList.toggle('dark');
const dark=document.body.classList.contains('dark');
localStorage.setItem('wareligent_theme',dark?'dark':'light');
$('themeBtn').textContent=dark?'☀':'☾';
};

if(localStorage.getItem('wareligent_theme')==='dark'){
document.body.classList.add('dark');
$('themeBtn').textContent='☀';
}

$('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
