<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Wareligent</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="home-app">

    <!-- Header (Profile Button on Top Right) -->
    <header class="home-header">
      <div class="header-left"></div>
      
      <div class="header-right">
        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="theme-button" aria-label="Toggle theme">
          <span id="themeIcon">☾</span>
        </button>

        <!-- Profile Button / Avatar -->
        <button id="profileBtn" class="profile-button" aria-label="Account profile">
          <div id="profileAvatar" class="avatar-default">👤</div>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="home-main">

      <!-- Brand Section -->
      <section class="brand-section">
        <h1 class="brand-logo">Wareligent</h1>
      </section>

      <!-- Simple Search Bar -->
      <section class="home-search-section">
        <button id="homeSearchButton" class="home-search-bar" type="button">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>
          <span>Search the web...</span>
        </button>
      </section>

      <!-- Simple Weather Widget -->
      <section class="weather-section">
        <div id="weatherCard" class="weather-card">
          <div class="weather-loading">Loading weather...</div>
        </div>
      </section>

    </main>

  </div>

  <!-- Profile / Auth Modal Overlay -->
  <div id="profileModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Account Profile</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>

      <div id="authContent" class="modal-body">
        <!-- Content dynamically injected via script.js -->
      </div>
    </div>
  </div>

</body>
</html>
