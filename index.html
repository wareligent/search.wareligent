<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --brand-primary: #6366f1;
            --brand-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 75px;
        }

        /* Top Brand Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .brand-logo span {
            color: var(--brand-primary);
        }

        .content-area {
            padding: 0 16px;
            flex: 1;
        }

        .hero-title {
            text-align: center;
            margin: 25px 0 20px 0;
        }

        .hero-title h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-title p {
            font-size: 0.82rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* Modern Professional Search Bar */
        .search-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 16px;
            gap: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .search-box:focus-within {
            border-color: var(--brand-primary);
        }

        .svg-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--text-sub);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .icon-btn:hover .svg-icon {
            stroke: var(--text-main);
        }

        .icon-btn.recording .svg-icon {
            stroke: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        #searchInput {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-main);
            font-size: 0.95rem;
            width: 100%;
        }

        #searchInput::placeholder {
            color: var(--text-sub);
        }

        /* Suggestions Dropdown */
        .suggestions-list {
            position: absolute;
            top: 108%;
            left: 0;
            right: 0;
            background: #1e293b;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            list-style: none;
            z-index: 100;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .suggestions-list li {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .suggestions-list li:last-child {
            border-bottom: none;
        }

        .suggestions-list li:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Feature Cards */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .feature-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .feature-card:hover {
            border-color: var(--brand-primary);
        }

        .feature-card .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .feature-card .card-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* Search & Feed Results Section */
        .results-feed {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .result-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: #818cf8;
            text-decoration: none;
            line-height: 1.4;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.5;
        }

        /* Clean Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 60px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-link {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
        }

        .nav-link.active .svg-icon {
            stroke: var(--brand-primary);
        }

        /* Hidden File Input for Image Search */
        #imageInput { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand-logo">wareligent<span>.search</span></div>
        </header>

        <main class="content-area">
            <div class="hero-title">
                <h1>Search the Web</h1>
                <p>Private, Fast & Intelligent Engine</p>
            </div>

            <!-- Functional Search Bar -->
            <div class="search-wrapper">
                <div class="search-box">
                    <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    
                    <input type="text" id="searchInput" placeholder="Search or type a URL..." autocomplete="off">
                    
                    <button id="clearBtn" class="icon-btn" style="display: none;" onclick="clearSearch()">
                        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>

                    <!-- Functional Image Search Button -->
                    <button class="icon-btn" title="Search by Image" onclick="document.getElementById('imageInput').click()">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    </button>
                    <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">

                    <!-- Functional Voice Search Button -->
                    <button id="voiceBtn" class="icon-btn" title="Voice Search" onclick="startVoiceRecognition()">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                </div>

                <ul id="suggestionsList" class="suggestions-list"></ul>
            </div>

            <!-- Interactive Features -->
            <div class="features-grid">
                <div class="feature-card" onclick="quickSearch('Latest Technology Trends')">
                    <div class="card-title">Tech Trends</div>
                    <div class="card-sub">Explore recent innovations</div>
                </div>
                <div class="feature-card" onclick="quickSearch('World News Today')">
                    <div class="card-title">Live News</div>
                    <div class="card-sub">Stay updated with world events</div>
                </div>
            </div>

            <!-- Results Section -->
            <div id="resultsFeed" class="results-feed"></div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-link active" onclick="clearSearch()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </button>
            <button class="nav-link" onclick="startVoiceRecognition()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
            </button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = "https://xveccsbdrysuiwyuvodw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestionsList = document.getElementById('suggestionsList');
        const resultsFeed = document.getElementById('resultsFeed');

        document.addEventListener('DOMContentLoaded', () => {
            loadInitialTrending();
        });

        // 1. প্রাথমিক ফিড লোড
        async function loadInitialTrending() {
            resultsFeed.innerHTML = `<p style="color: var(--text-sub); text-align: center; font-size: 0.85rem; padding: 20px;">Loading trending topics...</p>`;
            fetchWebResults('Technology News');
        }

        // 2. সার্চ ইনপুট হ্যান্ডলিং
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query ? 'flex' : 'none';
            if (!query) { suggestionsList.innerHTML = ''; return; }
            fetchSuggestions(query);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                suggestionsList.innerHTML = '';
                executeSearch();
            }
        });

        function clearSearch() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsList.innerHTML = '';
            loadInitialTrending();
        }

        function quickSearch(queryText) {
            searchInput.value = queryText;
            clearBtn.style.display = 'flex';
            executeSearch();
        }

        // 3. রিয়েল টাইপ সাজেশন
        function fetchSuggestions(query) {
            const oldScript = document.getElementById('jsonp-suggestions');
            if (oldScript) oldScript.remove();

            window.handleSuggestions = (data) => {
                suggestionsList.innerHTML = '';
                if (data && data[1]) {
                    data[1].slice(0, 5).forEach((term) => {
                        const li = document.createElement('li');
                        li.innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> ${term}`;
                        li.onclick = () => {
                            searchInput.value = term;
                            suggestionsList.innerHTML = '';
                            executeSearch();
                        };
                        suggestionsList.appendChild(li);
                    });
                }
            };

            const script = document.createElement('script');
            script.id = 'jsonp-suggestions';
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleSuggestions`;
            document.body.appendChild(script);
        }

        // 4. প্রধান সার্চ লজিক (Supabase + Fallback Web API)
        async function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            resultsFeed.innerHTML = `<p style="color: var(--text-sub); text-align: center; padding: 20px;">Searching Wareligent...</p>`;

            try {
                let { data: dbResults } = await supabaseClient
                    .from('websites')
                    .select('*')
                    .or(`title.ilike.%${query}%,keywords.ilike.%${query}%,description.ilike.%${query}%`)
                    .limit(6);

                resultsFeed.innerHTML = '';

                if (dbResults && dbResults.length > 0) {
                    dbResults.forEach(site => {
                        let domain = site.url;
                        try { domain = new URL(site.url).hostname; } catch(e){}

                        const card = document.createElement('div');
                        card.className = 'result-card';
                        card.innerHTML = `
                            <div class="result-meta">🌐 ${domain}</div>
                            <a href="${site.url}" target="_blank" class="result-title">${site.title}</a>
                            <p class="result-desc">${site.description || ''}</p>
                        `;
                        resultsFeed.appendChild(card);
                    });
                } else {
                    await fetchWebResults(query);
                }
            } catch (err) {
                await fetchWebResults(query);
            }
        }

        async function fetchWebResults(query) {
            try {
                const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
                const data = await res.json();
                resultsFeed.innerHTML = '';

                if (data.query && data.query.search.length > 0) {
                    data.query.search.forEach(item => {
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const itemUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}`;
                        
                        const card = document.createElement('div');
                        card.className = 'result-card';
                        card.innerHTML = `
                            <div class="result-meta">🌐 Live Web Result</div>
                            <a href="${itemUrl}" target="_blank" class="result-title">${item.title}</a>
                            <p class="result-desc">${cleanSnippet}...</p>
                        `;
                        resultsFeed.appendChild(card);
                    });
                } else {
                    resultsFeed.innerHTML = `<p style="text-align: center; color: var(--text-sub); padding: 20px;">No results found.</p>`;
                }
            } catch (e) {
                resultsFeed.innerHTML = `<p style="text-align: center; color: var(--text-sub); padding: 20px;">Failed to load results.</p>`;
            }
        }

        // 5. ভয়েস সার্চ (Voice Search Feature)
        function startVoiceRecognition() {
            const voiceBtn = document.getElementById('voiceBtn');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("আপনার ব্রাউজারে ভয়েস সার্চ সাপোর্ট করছে না। Chrome বা Edge ব্রাউজার ব্যবহার করুন।");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                voiceBtn.classList.add('recording');
                searchInput.placeholder = "Listening...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                searchInput.value = transcript;
                clearBtn.style.display = 'flex';
                executeSearch();
            };

            recognition.onerror = () => {
                alert("কথা শুনতে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('recording');
                searchInput.placeholder = "Search or type a URL...";
            };

            recognition.start();
        }

        // 6. ইমেজ আপলোড সার্চ (Image Search Feature)
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                // ফাইল নেম বা টপিক বের করে সার্চ
                const imageName = file.name.split('.')[0].replace(/[-_]/g, ' ');
                searchInput.value = imageName;
                clearBtn.style.display = 'flex';
                executeSearch();
            }
        }
    </script>
</body>
                                                                      </html>
