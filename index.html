<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Wareligent</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="home-app">

    <!-- Header -->
    <header class="home-header">
      <div class="header-nav-left">
        <a href="#ALL" class="nav-link active">ALL</a>
        <a href="/search.html?type=images" class="nav-link">IMAGES</a>
      </div>

      <div class="header-nav-right">
        <!-- Apps Icon -->
        <button class="icon-btn" aria-label="Apps">
          <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>

        <!-- Profile / Avatar Button -->
        <button id="profileBtn" class="profile-button" aria-label="Account profile">
          <div id="profileAvatar" class="avatar-default">W</div>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="home-main">

      <!-- Brand Logo -->
      <section class="brand-section">
        <h1 class="brand-logo">Wareligent</h1>
      </section>

      <!-- Search Bar -->
      <section class="home-search-section">
        <div id="homeSearchButton" class="home-search-bar">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search Wareligent or type a URL" />
          
          <div class="search-tools">
            <button class="tool-btn" aria-label="Voice Search">
              <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
            </button>
            <button class="tool-btn" aria-label="Camera Search">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Trending Searches Section -->
      <section class="trending-section">
        <div class="trending-header">
          <h2>Trending searches</h2>
          <button class="more-options-btn">&vellip;</button>
        </div>

        <div id="trendingList" class="trending-list">
          <div class="trending-item" data-query="honor magic9 pro max">
            <svg class="trend-icon" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
            <span>honor magic9 pro max</span>
          </div>
          <div class="trending-item" data-query="honor x9e pro">
            <svg class="trend-icon" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
            <span>honor x9e pro</span>
          </div>
          <div class="trending-item" data-query="pay scale">
            <svg class="trend-icon" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
            <span>pay scale</span>
          </div>
          <div class="trending-item" data-query="tech news today">
            <svg class="trend-icon" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
            <span>tech news today</span>
          </div>
          <div class="trending-item" data-query="latest football match">
            <svg class="trend-icon" viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
            <span>latest football match</span>
          </div>
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="home-footer">
      <div class="footer-location">
        <span>Bangladesh</span>
      </div>
      <div class="footer-links-row">
        <button id="themeToggleBtn" class="footer-link-btn">Dark theme: <span id="themeStateText">off</span></button>
        <a href="#" class="footer-link">Settings</a>
        <a href="#" class="footer-link">Privacy</a>
        <a href="#" class="footer-link">Terms</a>
      </div>
      <div class="footer-links-row">
        <a href="#" class="footer-link">Advertising</a>
        <a href="#" class="footer-link">Business</a>
        <a href="https://about-wareligent.vercel.app" class="footer-link">About</a>
      </div>
    </footer>

  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Wareligent Account</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <div id="authContent" class="modal-body"></div>
    </div>
  </div>

</body>
</html>
