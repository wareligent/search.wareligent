<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <!-- Vercel & Supabase Official SDK -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #f1f5f9;
            --accent-color: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 20px -2px rgba(99, 102, 241, 0.08);
            --shadow-lg: 0 10px 30px -4px rgba(0, 0, 0, 0.08);
        }

        body.dark-theme {
            --bg-color: #090d16;
            --card-bg: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
            --accent-color: #818cf8;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 30px -4px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 80px;
        }

        /* Top Minimal Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: transparent;
        }

        .nav-brand {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .nav-brand span {
            color: var(--accent-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        /* Content Area */
        .content-area {
            padding: 0 20px;
            flex: 1;
        }

        /* Brand Hero */
        .brand-section {
            text-align: center;
            margin: 28px 0 20px 0;
        }

        .main-logo {
            font-size: 2.6rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.2px;
        }

        .sub-text {
            color: var(--text-secondary);
            font-size: 0.82rem;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Modern Search Input */
        .search-section {
            position: relative;
            margin-bottom: 20px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 10px 18px;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
        }

        .search-bar:focus-within {
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-color);
        }

        .search-icon {
            font-size: 1rem;
            margin-right: 10px;
            opacity: 0.5;
        }

        #searchInput {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95rem;
            width: 100%;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.05rem;
            padding: 2px;
            margin-left: 8px;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        /* Category Filters */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-chip.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Auto Suggestions Dropdown */
        .suggestions-box {
            position: absolute;
            top: 110%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            list-style: none;
            z-index: 100;
            overflow: hidden;
        }

        .suggestions-box li {
            padding: 12px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .suggestions-box li:last-child {
            border-bottom: none;
        }

        /* Minimal History Pills */
        .history-section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.6px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .history-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-pill {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .history-pill span.icon {
            opacity: 0.5;
            font-size: 0.75rem;
        }

        /* News & Live Feed Cards */
        .feed-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .feed-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .feed-source {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .feed-source img {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .feed-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
            text-decoration: none;
        }

        .feed-snippet {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Media Grid / Video Element */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        .media-card {
            border-radius: 12px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .media-card img {
            width: 100%;
            height: 95px;
            object-fit: cover;
            display: block;
        }

        .media-title {
            padding: 8px;
            font-size: 0.72rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }

        .video-box {
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            box-shadow: var(--shadow-md);
        }

        .video-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0;
        }

        /* Minimal Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 60px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            color: var(--text-primary);
            padding: 8px;
        }

        .nav-item.active {
            opacity: 1;
            color: var(--accent-color);
        }

        .nav-item.center-ai {
            background: var(--accent-gradient);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            opacity: 1;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            margin-top: -16px;
        }

        /* Load More Button */
        .load-more-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin: 16px auto;
            display: block;
            box-shadow: var(--shadow-sm);
        }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }

        .auth-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
            background: var(--bg-color);
            color: var(--text-primary);
            outline: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="light-theme">

    <div class="app-container">
        <!-- Top Nav Header -->
        <header class="app-header">
            <div class="nav-brand">wareligent<span>.search</span></div>
            <div class="nav-actions">
                <button id="themeToggleBtn" class="icon-btn" title="Theme Toggle">🌙</button>
                <button id="profileBtn" class="icon-btn" title="Account">👤</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="content-area">
            
            <div class="brand-section">
                <h1 class="main-logo">wareligent</h1>
                <p class="sub-text">Privacy-Focused Smart Search Engine</p>
            </div>

            <!-- Main Search Input -->
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search web, news, videos..." autocomplete="off">
                    <button id="clearBtn" class="action-btn" style="display: none;">✕</button>
                    <button id="voiceBtn" class="action-btn" title="Voice Search">🎙️</button>
                </div>
                <ul id="suggestionsList" class="suggestions-box"></ul>
            </div>

            <!-- Category Tabs -->
            <div class="category-tabs" id="categoryTabs">
                <button class="tab-chip active" data-type="all">All Web</button>
                <button class="tab-chip" data-type="news">📰 Latest News</button>
                <button class="tab-chip" data-type="videos">▶ YouTube</button>
                <button class="tab-chip" data-type="images">🖼️ Images</button>
            </div>

            <!-- Clean Search History Pills -->
            <section class="history-section" id="historySection">
                <div class="section-title">Recent Searches</div>
                <div class="history-pills" id="historyGrid"></div>
            </section>

            <!-- Main Feed & Search Results -->
            <div id="resultsWrapper" class="feed-section"></div>

            <!-- Load More Container -->
            <div id="loadMoreContainer" style="display: none;">
                <button id="loadMoreBtn" class="load-more-btn">Load More</button>
            </div>

        </main>

        <!-- Bottom Navigation Shell -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="resetToHome()">🏠</button>
            <button class="nav-item" onclick="document.getElementById('voiceBtn').click()">🎙️</button>
            <button class="nav-item center-ai" onclick="document.getElementById('searchInput').focus()">✨</button>
            <button class="nav-item" onclick="document.getElementById('profileBtn').click()">👤</button>
            <button class="nav-item" onclick="document.getElementById('themeToggleBtn').click()">⚙️</button>
        </nav>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <p id="deleteModalText" style="font-size: 0.95rem; margin-bottom: 16px;">Delete item?</p>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button id="cancelDeleteBtn" style="padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); cursor: pointer;">Cancel</button>
                <button id="confirmDeleteBtn" style="padding: 8px 16px; border-radius: 8px; border: none; background: #ef4444; color: white; cursor: pointer;">Delete</button>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div id="loggedOutView">
                <h3 style="margin-bottom: 8px; text-align: center; font-size: 1.1rem;">Account Login</h3>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 16px; text-align: center;">Sync history across all devices</p>

                <input type="email" id="authEmail" class="auth-input" placeholder="Email address">
                <input type="password" id="authPassword" class="auth-input" placeholder="Password">

                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <button id="loginBtn" style="flex: 1; padding: 10px; background: var(--accent-color); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Login</button>
                    <button id="signupBtn" style="flex: 1; padding: 10px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Sign Up</button>
                </div>
            </div>

            <div id="loggedInView" style="display: none; text-align: center;">
                <h3 style="margin-bottom: 6px;">Your Profile</h3>
                <p id="loggedInUserEmail" style="font-size: 0.88rem; color: var(--accent-color); margin-bottom: 16px; font-weight: 600;"></p>
                <button id="logoutBtn" style="width: 100%; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Logout</button>
            </div>

            <div style="text-align: center; margin-top: 14px;">
                <button id="closeAuthModal" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.8rem;">Close</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xveccsbdrysuiwyuvodw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let targetDeleteId = null;
        let currentSearchQuery = "";
        let currentSearchCategory = "all";
        let currentUser = null;
        let currentPage = 0;
        const PAGE_SIZE = 5;

        document.addEventListener('DOMContentLoaded', () => { 
            checkUserSession();
            loadDefaultNewsFeed(); // প্রাথমিক ক্লিন ফিড লোড
        });

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateUIForUser(session ? session.user : null);

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                updateUIForUser(session ? session.user : null);
                loadSearchHistory();
            });
        }

        function updateUIForUser(user) {
            currentUser = user;
            const loggedOutView = document.getElementById('loggedOutView');
            const loggedInView = document.getElementById('loggedInView');
            const loggedInUserEmail = document.getElementById('loggedInUserEmail');

            if (user) {
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'block';
                loggedInUserEmail.textContent = user.email;
            } else {
                loggedOutView.style.display = 'block';
                loggedInView.style.display = 'none';
            }
        }

        /* --- Default Home News Feed (Cleaner UI) --- */
        async function loadDefaultNewsFeed() {
            const resultsWrapper = document.getElementById('resultsWrapper');
            resultsWrapper.innerHTML = `<p style="color: var(--text-secondary); text-align: center; font-size:0.85rem; padding: 20px;">Fetching latest updates...</p>`;
            
            try {
                const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=technology%20news&format=json&origin=*`);
                const data = await res.json();
                resultsWrapper.innerHTML = '';

                if (data.query && data.query.search.length > 0) {
                    data.query.search.slice(0, 5).forEach(item => {
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.innerHTML = `
                            <div class="feed-source">
                                <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=32" alt="">
                                <span>Trending News</span>
                            </div>
                            <a class="feed-title" href="/view.html?url=${encodeURIComponent('https://en.wikipedia.org/wiki/' + item.title)}&title=${encodeURIComponent(item.title)}">${item.title}</a>
                            <p class="feed-snippet">${cleanSnippet}...</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });
                }
            } catch (e) {
                resultsWrapper.innerHTML = '';
            }
        }

        /* --- Search History (Minimal Pills) --- */
        async function loadSearchHistory() {
            const historyGrid = document.getElementById('historyGrid');
            if (!historyGrid) return;

            try {
                let query = supabaseClient.from('search_suggestions').select('id, keyword').order('created_at', { ascending: false }).limit(6);
                if (currentUser) query = query.eq('user_id', currentUser.id);
                else query = query.is('user_id', null);

                const { data } = await query;
                historyGrid.innerHTML = '';

                if (data && data.length > 0) {
                    data.forEach(item => {
                        const pill = document.createElement('div');
                        pill.className = 'history-pill';
                        pill.innerHTML = `<span class="icon">🕒</span> ${item.keyword}`;

                        let timer;
                        pill.addEventListener('touchstart', () => timer = setTimeout(() => showDeleteModal(item.id, item.keyword), 600));
                        pill.addEventListener('touchend', () => clearTimeout(timer));
                        pill.addEventListener('click', () => {
                            searchInput.value = item.keyword;
                            clearBtn.style.display = 'block';
                            executeSearch(item.keyword);
                        });

                        historyGrid.appendChild(pill);
                    });
                } else {
                    document.getElementById('historySection').style.display = 'none';
                }
            } catch (err) { console.error(err); }
        }

        function showDeleteModal(id, keyword) {
            targetDeleteId = id;
            document.getElementById('deleteModalText').innerHTML = `Remove "<strong>${keyword}</strong>" from history?`;
            document.getElementById('deleteModalOverlay').style.display = 'flex';
        }

        document.getElementById('cancelDeleteBtn').onclick = () => document.getElementById('deleteModalOverlay').style.display = 'none';
        document.getElementById('confirmDeleteBtn').onclick = async () => {
            if (!targetDeleteId) return;
            await supabaseClient.from('search_suggestions').delete().eq('id', targetDeleteId);
            document.getElementById('deleteModalOverlay').style.display = 'none';
            loadSearchHistory();
        };

        /* --- Search Input Events & Suggestions --- */
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestionsList = document.getElementById('suggestionsList');
        let debounceTimer;

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query ? 'block' : 'none';
            if (!query) { suggestionsList.innerHTML = ''; return; }
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => fetchSuggestions(query), 200);
        });

        clearBtn.onclick = () => resetToHome();

        function resetToHome() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsList.innerHTML = '';
            document.getElementById('loadMoreContainer').style.display = 'none';
            document.getElementById('historySection').style.display = 'block';
            loadDefaultNewsFeed();
        }

        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeSearch(); });

        function fetchSuggestions(query) {
            const oldScript = document.getElementById('jsonp-suggestions');
            if (oldScript) oldScript.remove();

            window.handleGoogleSuggestions = (data) => renderSuggestions((data && data[1]) ? data[1] : []);

            const script = document.createElement('script');
            script.id = 'jsonp-suggestions';
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleGoogleSuggestions`;
            document.body.appendChild(script);
        }

        function renderSuggestions(suggestions) {
            suggestionsList.innerHTML = '';
            suggestions.slice(0, 5).forEach((term) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>🔍</span> ${term}`;
                li.onclick = () => {
                    searchInput.value = term;
                    suggestionsList.innerHTML = '';
                    executeSearch(term);
                };
                suggestionsList.appendChild(li);
            });
        }

        /* --- Filter Tabs Click Handler --- */
        const tabChips = document.querySelectorAll('.tab-chip');
        tabChips.forEach(chip => {
            chip.addEventListener('click', function() {
                tabChips.forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                currentSearchCategory = this.dataset.type;
                if (currentSearchQuery) renderCategoryResults(currentSearchQuery, currentSearchCategory);
            });
        });

        async function renderCategoryResults(query, type) {
            const resultsWrapper = document.getElementById('resultsWrapper');
            document.getElementById('loadMoreContainer').style.display = 'none';

            if (type === "all") {
                executeSearch(query, false);
            } else if (type === "videos") {
                resultsWrapper.innerHTML = `
                    <div class="video-box">
                        <iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}" allowfullscreen></iframe>
                    </div>
                `;
            } else if (type === "news") {
                resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px; color: var(--text-secondary);">Loading News...</p>`;
                const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
                const data = await res.json();
                resultsWrapper.innerHTML = '';
                if (data.query && data.query.search.length > 0) {
                    data.query.search.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.innerHTML = `
                            <div class="feed-source"><span>📰 Wikipedia News</span></div>
                            <a class="feed-title" href="/view.html?url=${encodeURIComponent('https://en.wikipedia.org/wiki/' + item.title)}&title=${encodeURIComponent(item.title)}">${item.title}</a>
                            <p class="feed-snippet">${item.snippet.replace(/<\/?[^>]+(>|$)/g, "")}...</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });
                }
            } else if (type === "images") {
                resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px; color: var(--text-secondary);">Loading Images...</p>`;
                const res = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&prop=pageimages&piprop=thumbnail&pithumbsize=400&gsrsearch=${encodeURIComponent(query)}&gsrlimit=12&format=json&origin=*`);
                const data = await res.json();
                resultsWrapper.innerHTML = '';
                const mediaGrid = document.createElement('div');
                mediaGrid.className = 'media-grid';

                if (data.query && data.query.pages) {
                    Object.values(data.query.pages).forEach(page => {
                        if (page.thumbnail) {
                            const card = document.createElement('div');
                            card.className = 'media-card';
                            card.innerHTML = `<img src="${page.thumbnail.source}"><div class="media-title">${page.title.replace("File:", "")}</div>`;
                            card.onclick = () => window.open(page.thumbnail.source, '_blank');
                            mediaGrid.appendChild(card);
                        }
                    });
                    resultsWrapper.appendChild(mediaGrid);
                }
            }
        }

        /* --- Main Search Execution (Supabase DB + Web Fallback) --- */
        async function executeSearch(queryStr) {
            const query = queryStr || searchInput.value.trim();
            if (!query) return;

            currentSearchQuery = query;
            suggestionsList.innerHTML = '';
            document.getElementById('historySection').style.display = 'none';

            const resultsWrapper = document.getElementById('resultsWrapper');
            resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px; color: var(--text-secondary);">Searching Wareligent DB...</p>`;

            try {
                let { data: searchResults } = await supabaseClient
                    .from('websites')
                    .select('*')
                    .or(`title.ilike.%${query}%,keywords.ilike.%${query}%,description.ilike.%${query}%`)
                    .limit(6);

                resultsWrapper.innerHTML = '';

                if (searchResults && searchResults.length > 0) {
                    searchResults.forEach(site => {
                        let domain = site.url;
                        try { domain = new URL(site.url).hostname; } catch(e){}

                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.innerHTML = `
                            <div class="feed-source">
                                <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="">
                                <span>${domain}</span>
                            </div>
                            <a href="/view.html?url=${encodeURIComponent(site.url)}&title=${encodeURIComponent(site.title)}" class="feed-title">${site.title}</a>
                            <p class="feed-snippet">${site.description || ''}</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });
                } else {
                    renderCategoryResults(query, "news");
                }
            } catch (err) {
                console.error(err);
            }
        }

        /* --- Auth Modal Control & Theme Toggle --- */
        const authModalOverlay = document.getElementById('authModalOverlay');
        document.getElementById('profileBtn').onclick = () => authModalOverlay.style.display = 'flex';
        document.getElementById('closeAuthModal').onclick = () => authModalOverlay.style.display = 'none';

        document.getElementById('themeToggleBtn').onclick = () => {
            document.body.classList.toggle('dark-theme');
            document.body.classList.toggle('light-theme');
            document.getElementById('themeToggleBtn').textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        };

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert(error.message); else authModalOverlay.style.display = 'none';
        };

        document.getElementById('signupBtn').onclick = async () => {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert(error.message); else alert('Success! Check email.');
        };

        document.getElementById('logoutBtn').onclick = async () => {
            await supabaseClient.auth.signOut();
            authModalOverlay.style.display = 'none';
        };
    </script>
</body>
</html>
