<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wareligent</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <div class="app">

    <!-- Top Bar -->
    <header class="topbar">

      <div class="topbar-spacer"></div>

      <div class="top-actions">

        <!-- Clear -->
        <button
          id="fireBtn"
          class="top-btn"
          type="button"
          aria-label="Clear"
        >
          <svg viewBox="0 0 24 24">
            <path d="M13.5 0.7s-2.6 2.2-2.6 4.7c0 1.3.5 2.4 1.3 3.2-1.8 0-3.3 1.5-3.3 3.3 0 .3 0 .5.1.8-1-.7-1.7-1.8-1.7-3.2 0-.2 0-.5.1-.7-2.3 1.6-3.7 4.1-3.7 7.1 0 4.8 3.9 8.7 8.7 8.7s8.7-3.9 8.7-8.7c0-5.8-4.4-10.6-7.6-15.2z"/>
          </svg>
        </button>

        <!-- Menu -->
        <button
          id="menuBtn"
          class="top-btn"
          type="button"
          aria-label="Settings"
        >
          <svg viewBox="0 0 24 24">
            <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.9 3a7.8 7.8 0 0 0-.7-1.8l1.4-1.4-1.4-1.4-1.4 1.4a7.8 7.8 0 0 0-1.8-.7V5h-2v2.1a7.8 7.8 0 0 0-1.8.7L11.8 6.4 10.4 7.8l1.4 1.4a7.8 7.8 0 0 0-.7 1.8H9v2h2.1c.2.6.4 1.2.7 1.8l-1.4 1.4 1.4 1.4 1.4-1.4c.6.3 1.2.6 1.8.7V19h2v-2.1c.6-.2 1.2-.4 1.8-.7l1.4 1.4 1.4-1.4-1.4-1.4c.3-.6.6-1.2.7-1.8H21v-2h-2.1z"/>
          </svg>
        </button>

      </div>
    </header>


    <!-- Main -->
    <main class="main">

      <!-- Logo -->
      <div class="logo" id="brandTitle">
        Wareligent
      </div>


      <!-- Search -->
      <div class="search-box" id="searchBox">

        <!-- Back -->
        <button
          id="backBtn"
          class="back-btn"
          type="button"
          aria-label="Back"
        >
          <svg viewBox="0 0 24 24">
            <path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/>
          </svg>
        </button>


        <!-- Search -->
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
        >
          <path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.4-1.4-5.2-5.2zM9.5 14A4.5 4.5 0 1 1 9.5 5a4.5 4.5 0 0 1 0 9z"/>
        </svg>


        <input
          id="searchInput"
          type="text"
          placeholder="Search Wareligent"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search"
        >


        <!-- Clear -->
        <button
          id="clearBtn"
          class="clear-btn"
          type="button"
          aria-label="Clear search"
        >
          ×
        </button>


        <!-- AI -->
        <button
          id="aiSparkBtn"
          class="ai-btn"
          type="button"
          aria-label="AI Search"
        >
          <svg viewBox="0 0 24 24">
            <path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2zm7 14l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16z"/>
          </svg>
        </button>

      </div>

    </main>


    <!-- Settings -->
    <div
      id="menuModal"
      class="menu-modal"
      aria-hidden="true"
    >

      <div class="menu">

        <div class="menu-top">
          <span>Settings</span>

          <button
            id="closeMenuBtn"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </div>


        <button
          id="themeToggleBtn"
          class="setting"
          type="button"
        >
          <span>Dark mode</span>
          <span id="themeStatus">Off</span>
        </button>


        <a
          class="setting"
          href="https://about-wareligent.vercel.app"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>About</span>
          <span>→</span>
        </a>

      </div>

    </div>


    <!-- Fire Effect -->
    <div
      id="fireOverlay"
      class="fire-overlay"
    ></div>

  </div>

</body>
</html>
