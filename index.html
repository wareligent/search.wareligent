<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <!-- Supabase Official SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* লং-প্রেস ডিলিট পপ-আপ মোডাল স্টাইল */
        .delete-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .delete-modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: var(--shadow-lg);
        }

        .delete-modal p {
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 18px;
            word-break: break-word;
        }

        .delete-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .delete-modal-actions button {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-cancel {
            background: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color) !important;
        }

        .btn-confirm-delete {
            background: #ef4444;
            color: #ffffff;
        }
    </style>
</head>
<body class="light-theme">
    <div class="wrapper">
        <!-- হেডার -->
        <header class="navbar">
            <div class="nav-brand">wareligent<span>.search</span></div>
            <div class="nav-actions">
                <button id="themeToggleBtn" class="theme-btn" title="Toggle Theme">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </header>

        <main class="content-area">
            <!-- ব্র্যান্ড লোগো -->
            <div class="brand-container">
                <h1 class="main-logo">wareligent</h1>
                <p class="sub-text">Search the web intelligently</p>
            </div>

            <!-- সার্চ বক্স -->
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off">
                    <button id="clearBtn" class="action-btn" style="display: none;">✕</button>
                    <button id="voiceBtn" class="action-btn" title="Voice Search">🎙️</button>
                </div>
                <ul id="suggestionsList" class="suggestions-box"></ul>
            </div>

            <!-- ফিল্টার ক্যাটাগরি -->
            <div class="category-tabs" id="categoryTabs" style="display: none;">
                <button class="tab-chip active">All</button>
                <button class="tab-chip">Images</button>
                <button class="tab-chip">News</button>
                <button class="tab-chip">Videos</button>
            </div>

            <!-- সার্চ হিস্ট্রি -->
            <section class="trending-box" id="trendingBox">
                <div class="trending-header">
                    <span>🕒 Search History</span>
                </div>
                <div class="trending-grid" id="trendingGrid"></div>
            </section>

            <!-- সার্চ রেজাল্ট কন্টেইনার -->
            <div id="resultsWrapper" class="results-container"></div>
        </main>

        <!-- ফুটার সেকশন -->
        <footer class="footer-container">
            <p>&copy; 2026 Wareligent. All rights reserved. | <a href="https://about-wareligent.vercel.app" target="_blank" rel="noopener noreferrer">ABOUT US</a></p>
        </footer>
    </div>

    <!-- ডিলিট কনফার্মেশন মোডাল -->
    <div id="deleteModalOverlay" class="delete-modal-overlay" style="display: none;">
        <div class="delete-modal">
            <p id="deleteModalText">Delete this item from history?</p>
            <div class="delete-modal-actions">
                <button class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
                <button class="btn-confirm-delete" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // --- SUPABASE INTEGRATION ---
        const SUPABASE_URL = "https://xveccsbdrysuiwyuvodw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let targetDeleteId = null;

        // --- FETCH SEARCH HISTORY WITH LONG PRESS DELETE ---
        async function loadTrendingTopics() {
            const trendingGrid = document.getElementById('trendingGrid');
            if (!trendingGrid) return;

            try {
                const { data, error } = await supabaseClient
                    .from('search_suggestions')
                    .select('id, keyword, search_count')
                    .order('search_count', { ascending: false })
                    .limit(7);

                if (error) {
                    console.error("Search History Fetch Error:", error.message);
                    return;
                }

                trendingGrid.innerHTML = '';

                if (data && data.length > 0) {
                    data.forEach((item, index) => {
                        const trendItem = document.createElement('div');
                        trendItem.className = 'trend-item';
                        trendItem.dataset.query = item.keyword;
                        trendItem.dataset.id = item.id;

                        const numberFormatted = String(index + 1).padStart(2, '0');

                        trendItem.innerHTML = `
                            <span class="trend-no">${numberFormatted}</span>
                            <span class="trend-text">${item.keyword}</span>
                        `;

                        // LONG PRESS DELETE (মোবাইল ও পিসির জন্য)
                        let pressTimer;
                        let isLongPress = false;

                        const startPress = () => {
                            isLongPress = false;
                            pressTimer = setTimeout(() => {
                                isLongPress = true;
                                showDeleteModal(item.id, item.keyword);
                            }, 600); // ৬০০ মিলি-সেকেন্ড চেপে ধরে রাখলে সক্রিয় হবে
                        };

                        const cancelPress = () => {
                            clearTimeout(pressTimer);
                        };

                        // টাচ ও মাউস ইভেন্টসমূহ
                        trendItem.addEventListener('touchstart', startPress);
                        trendItem.addEventListener('touchend', cancelPress);
                        trendItem.addEventListener('touchmove', cancelPress);

                        trendItem.addEventListener('mousedown', startPress);
                        trendItem.addEventListener('mouseup', cancelPress);
                        trendItem.addEventListener('mouseleave', cancelPress);

                        // সাধারণ ক্লিকে সার্চ সম্পন্ন করা
                        trendItem.addEventListener('click', function(e) {
                            if (isLongPress) return; // লং-প্রেস হলে সার্চ হবে না
                            const query = this.dataset.query;
                            searchInput.value = query;
                            clearBtn.style.display = 'block';
                            executeSearch(query);
                        });

                        trendingGrid.appendChild(trendItem);
                    });
                }
            } catch (err) {
                console.error("Failed to load search history:", err);
            }
        }

        // --- DELETE MODAL CONTROLS ---
        function showDeleteModal(id, keyword) {
            targetDeleteId = id;
            document.getElementById('deleteModalText').innerHTML = `Delete "<strong>${keyword}</strong>" from history?`;
            document.getElementById('deleteModalOverlay').style.display = 'flex';
        }

        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            document.getElementById('deleteModalOverlay').style.display = 'none';
            targetDeleteId = null;
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!targetDeleteId) return;

            try {
                const { error } = await supabaseClient
                    .from('search_suggestions')
                    .delete()
                    .eq('id', targetDeleteId);

                if (!error) {
                    document.getElementById('deleteModalOverlay').style.display = 'none';
                    targetDeleteId = null;
                    loadTrendingTopics(); // হিস্ট্রি রিফ্রেশ করা
                } else {
                    console.error("Delete Error:", error.message);
                }
            } catch (err) {
                console.error("Delete exception:", err);
            }
        });

        // --- DATABASE INSERT & COUNT UPDATE FUNCTION ---
        async function saveSearchWordToDatabase(word) {
            if (!word) return;
            const cleanWord = word.trim().toLowerCase();

            if (!cleanWord || cleanWord.length < 2) return;

            try {
                const { data, error } = await supabaseClient
                    .from("search_suggestions")
                    .select("id, search_count")
                    .eq("keyword", cleanWord)
                    .maybeSingle();

                if (error) {
                    console.error("Supabase Select Error:", error.message);
                    return;
                }

                if (data) {
                    const newCount = (data.search_count || 1) + 1;
                    await supabaseClient
                        .from("search_suggestions")
                        .update({ search_count: newCount })
                        .eq("id", data.id);
                } else {
                    await supabaseClient
                        .from("search_suggestions")
                        .insert([{ keyword: cleanWord, search_count: 1 }]);
                }
            } catch (err) {
                console.error("Database Save Exception:", err);
            }
        }

        // --- DOM ELEMENTS ---
        const searchInput = document.getElementById('searchInput');
        const suggestionsList = document.getElementById('suggestionsList');
        const resultsWrapper = document.getElementById('resultsWrapper');
        const trendingBox = document.getElementById('trendingBox');
        const categoryTabs = document.getElementById('categoryTabs');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const clearBtn = document.getElementById('clearBtn');
        const voiceBtn = document.getElementById('voiceBtn');

        let selectedIndex = -1;
        let debounceTimer;

        // SECTION 1: Page Load & Theme Switcher
        document.addEventListener('DOMContentLoaded', loadTrendingTopics);

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            document.body.classList.toggle('light-theme');
            themeIcon.textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        });

        // SECTION 2: Input & Clear Button Handling
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query ? 'block' : 'none';
            selectedIndex = -1;

            if (!query) {
                suggestionsList.innerHTML = '';
                return;
            }

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                fetchSuggestions(query);
            }, 200);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsList.innerHTML = '';
            resultsWrapper.innerHTML = '';
            categoryTabs.style.display = 'none';
            trendingBox.style.display = 'block';
        });

        // SECTION 3: Keyboard Navigation
        searchInput.addEventListener('keydown', (e) => {
            const items = suggestionsList.querySelectorAll('li');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (items.length > 0) {
                    selectedIndex = (selectedIndex + 1) % items.length;
                    updateSelection(items);
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (items.length > 0) {
                    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                    updateSelection(items);
                }
            } else if (e.key === 'Enter') {
                executeSearch();
            }
        });

        function updateSelection(items) {
            items.forEach((item, index) => {
                if (index === selectedIndex) {
                    item.classList.add('selected');
                    searchInput.value = item.dataset.val;
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        // SECTION 4: Real-time Auto-Suggest API (JSONP Method)
        function fetchSuggestions(query) {
            const oldScript = document.getElementById('jsonp-suggestions');
            if (oldScript) oldScript.remove();

            window.handleGoogleSuggestions = function(data) {
                const suggestions = (data && data[1]) ? data[1] : [];
                renderSuggestions(suggestions);
            };

            const script = document.createElement('script');
            script.id = 'jsonp-suggestions';
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleGoogleSuggestions`;
            script.onerror = () => renderSuggestions([]);
            
            document.body.appendChild(script);
        }

        function renderSuggestions(suggestions) {
            suggestionsList.innerHTML = '';
            if (suggestions.length === 0) return;

            suggestions.slice(0, 5).forEach((term) => {
                const li = document.createElement('li');
                li.dataset.val = term;
                li.innerHTML = `<span>🔍</span> ${term}`;
                li.onclick = () => {
                    searchInput.value = term;
                    suggestionsList.innerHTML = '';
                    executeSearch(term);
                };
                suggestionsList.appendChild(li);
            });
        }

        // SECTION 5: Voice Search
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            voiceBtn.addEventListener('click', () => {
                recognition.start();
                voiceBtn.style.color = '#ef4444';
            });

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                searchInput.value = transcript;
                voiceBtn.style.color = '';
                executeSearch(transcript);
            };

            recognition.onend = () => { voiceBtn.style.color = ''; };
        }

        // SECTION 6: Search Execution and Website Redirection
        async function executeSearch(queryStr) {
            const query = (typeof queryStr === 'string' && queryStr.trim() !== '') ? queryStr.trim() : searchInput.value.trim();
            suggestionsList.innerHTML = '';
            
            if (!query) return;

            await saveSearchWordToDatabase(query);
            loadTrendingTopics(); 

            const isDomain = /^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/.*)?$/.test(query);
            const hasProtocol = /^https?:\/\//i.test(query);

            if (isDomain || hasProtocol) {
                const finalUrl = hasProtocol ? query : `https://${query}`;
                window.open(finalUrl, '_blank');
                return;
            }

            trendingBox.style.display = 'none';
            categoryTabs.style.display = 'flex';
            resultsWrapper.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Searching for "${query}"...</p>`;

            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');

            try {
                const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&origin=*`);
                const data = await res.json();
                resultsWrapper.innerHTML = '';

                if (data.AbstractText) {
                    const card = document.createElement('div');
                    card.className = 'result-card';
                    card.innerHTML = `
                        <div class="result-header">
                            <img src="https://www.google.com/s2/favicons?domain=${new URL(data.AbstractURL).hostname}&sz=32" class="site-icon" alt="">
                            <span class="site-url">${data.AbstractSource || 'Instant Answer'}</span>
                        </div>
                        <a href="${data.AbstractURL}" target="_blank" class="result-title">${data.Heading || query}</a>
                        <p class="result-snippet">${data.AbstractText}</p>
                    `;
                    resultsWrapper.appendChild(card);
                }

                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.slice(0, 5).forEach(topic => {
                        if (topic.Text && topic.FirstURL) {
                            const domain = new URL(topic.FirstURL).hostname;
                            const card = document.createElement('div');
                            card.className = 'result-card';
                            card.innerHTML = `
                                <div class="result-header">
                                    <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" class="site-icon" alt="">
                                    <span class="site-url">${domain}</span>
                                </div>
                                <a href="${topic.FirstURL}" target="_blank" class="result-title">${topic.Text.split(' - ')[0]}</a>
                                <p class="result-snippet">${topic.Text}</p>
                            `;
                            resultsWrapper.appendChild(card);
                        }
                    });
                }

                if (resultsWrapper.innerHTML === '') {
                    resultsWrapper.innerHTML = `
                        <p style="color: var(--text-secondary); text-align: center; padding: 20px;">
                            Full search results opened in a new tab.<br>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" style="color: var(--accent-color); text-decoration: underline;">Click here</a> if Google search didn't open automatically.
                        </p>`;
                }
            } catch (err) {
                resultsWrapper.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Results opened in a new window.</p>`;
            }
        }
    </script>
</body>
</html>
