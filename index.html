<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Wareligent Search</title>

  <link rel="stylesheet" href="/style.css" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Main JS -->
  <script src="/script.js" defer></script>
</head>

<body>
  <div class="app">

    <!-- Header -->
    <header class="top-header">
      <button class="profile-btn" id="profileBtn" aria-label="Profile">
        <span>👤</span>
      </button>

      <div class="brand">
        <div class="brand-logo">W</div>
        <div class="brand-name">Wareligent</div>
      </div>

      <button class="icon-btn" id="themeToggleBtn" aria-label="Theme">
        <span id="themeIcon">☼</span>
      </button>
    </header>


    <!-- Search -->
    <main>

      <section class="search-section">

        <form id="searchForm" class="search-bar">

          <button type="submit" class="search-icon-btn" aria-label="Search">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-4-4"></path>
            </svg>
          </button>

          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Search or type a URL..."
          />

          <button
            type="button"
            id="clearBtn"
            class="search-action hidden"
            aria-label="Clear"
          >
            ×
          </button>

          <button
            type="button"
            id="imageBtn"
            class="search-action"
            aria-label="Image search"
          >
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="15" rx="3"></rect>
              <circle cx="8.5" cy="10" r="1.5"></circle>
              <path d="M5 17l5-5 3 3 2-2 4 4"></path>
            </svg>
          </button>

          <button
            type="button"
            id="voiceBtn"
            class="search-action"
            aria-label="Voice search"
          >
            <svg viewBox="0 0 24 24">
              <rect x="9" y="3" width="6" height="12" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <path d="M12 18v3"></path>
              <path d="M8 21h8"></path>
            </svg>
          </button>

          <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
          />

        </form>

        <!-- Suggestions -->
        <ul id="suggestionsList" class="suggestions" hidden></ul>

      </section>


      <!-- Quick Features -->
      <section class="quick-grid">

        <button class="quick-card" data-action="rewards">
          <div class="quick-icon rewards">★</div>
          <strong>Rewards</strong>
          <small>0/75</small>
        </button>

        <button class="quick-card" data-action="images">
          <div class="quick-icon images">▧</div>
          <strong>Image Search</strong>
          <small>AI powered</small>
        </button>

        <button class="quick-card" data-action="news">
          <div class="quick-icon news">▤</div>
          <strong>Latest News</strong>
          <small>Stay updated</small>
        </button>

        <button class="quick-card" data-action="trending">
          <div class="quick-icon trending">🔥</div>
          <strong>Trending</strong>
          <small>Popular now</small>
        </button>

      </section>


      <!-- Categories -->
      <nav class="category-tabs" id="categoryTabs">

        <button class="tab active" data-mode="all">
          All
        </button>

        <button class="tab" data-mode="news">
          News
        </button>

        <button class="tab" data-mode="images">
          Images
        </button>

        <button class="tab" data-mode="videos">
          Videos
        </button>

        <button class="tab" data-mode="web">
          Web
        </button>

      </nav>


      <!-- Trending -->
      <section class="content-card" id="trendingBox">

        <div class="section-heading">
          <div>
            <span class="section-icon fire">🔥</span>
            <h2>Trending Searches</h2>
          </div>

          <button id="seeTrendingBtn" class="see-all">
            See all →
          </button>
        </div>

        <div id="trendingGrid" class="trending-list"></div>

      </section>


      <!-- Results -->
      <section class="results-section">

        <div
          id="searchPerfMeta"
          class="search-meta"
          hidden
        ></div>

        <div id="resultsWrapper"></div>

      </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

      <button class="bottom-item active" data-nav="home">
        <span class="bottom-icon">⌂</span>
        <small>Home</small>
      </button>

      <button class="bottom-item" data-nav="images">
        <span class="bottom-icon">▣</span>
        <small>Images</small>
      </button>

      <button class="bottom-item" data-nav="videos">
        <span class="bottom-icon">▶</span>
        <small>Videos</small>
      </button>

      <button class="bottom-item" data-nav="history">
        <span class="bottom-icon">◷</span>
        <small>History</small>
      </button>

      <button class="bottom-item" data-nav="more">
        <span class="bottom-icon">⊞</span>
        <small>More</small>
      </button>

    </nav>


    <!-- Toast -->
    <div id="toastContainer" class="toast-container"></div>

  </div>
</body>
</html>
