<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <!-- Supabase Official SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --highlight-bg: #fef08a;
            --highlight-text: #854d0e;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        body.dark-theme {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --highlight-bg: #854d0e;
            --highlight-text: #fef08a;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Fixed Navbar UI */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .nav-brand {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .nav-brand span {
            color: var(--accent-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Main Content Layout */
        .content-area {
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
            flex: 1;
        }

        .brand-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .main-logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        .sub-text {
            color: var(--text-secondary);
            font-size: 0.88rem;
        }

        /* Search Bar */
        .search-section {
            position: relative;
            margin-bottom: 20px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 8px 16px;
            box-shadow: var(--shadow-md);
        }

        .search-bar:focus-within {
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-color);
        }

        .search-icon {
            font-size: 1rem;
            margin-right: 10px;
            opacity: 0.6;
        }

        #searchInput {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95rem;
            width: 100%;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            margin-left: 4px;
            color: var(--text-secondary);
        }

        /* Category Chips */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-chip.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Suggestions Dropdown */
        .suggestions-box {
            position: absolute;
            top: 108%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            list-style: none;
            z-index: 100;
            overflow: hidden;
        }

        .suggestions-box li {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
        }

        .suggestions-box li:last-child {
            border-bottom: none;
        }

        /* Search History Box */
        .trending-box {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .trending-header {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .trending-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .trend-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            background: var(--bg-color);
            cursor: pointer;
        }

        .trend-no {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-right: 10px;
        }

        .trend-text {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        /* Search Response Time Styling */
        .search-perf-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            padding: 8px 0;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: none;
        }

        /* Highlight Style */
        mark.highlight {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            font-weight: 700;
            padding: 0 2px;
            border-radius: 3px;
        }

        /* Search Results Cards */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .result-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .site-icon {
            width: 14px;
            height: 14px;
        }

        .site-url {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .result-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-color);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 4px;
        }

        .result-snippet {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Load More Button Style */
        .load-more-container {
            text-align: center;
            margin-top: 16px;
            margin-bottom: 10px;
        }

        .load-more-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .load-more-btn:hover {
            background: var(--border-color);
            box-shadow: var(--shadow-md);
        }

        /* Media Grid & Video Elements */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .media-card {
            border-radius: 8px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .media-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        .media-title {
            padding: 6px;
            font-size: 0.72rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-box {
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Modal Styles */
        .delete-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .delete-modal {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            border: 1px solid var(--border-color);
        }

        .auth-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            background: var(--bg-color);
            color: var(--text-primary);
            outline: none;
            font-size: 0.9rem;
        }

        .footer-container {
            text-align: center;
            padding: 16px;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .footer-container a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body class="light-theme">
    <div class="wrapper">
        <!-- Header -->
        <header class="navbar">
            <div class="nav-brand">wareligent<span>.search</span></div>
            <div class="nav-actions">
                <button id="themeToggleBtn" class="theme-btn" title="Toggle Theme">
                    <span id="themeIcon">🌙</span>
                </button>
                <button id="profileBtn" class="theme-btn">
                    👤 <span id="userStatusText">Guest</span>
                </button>
            </div>
        </header>

        <main class="content-area">
            <div class="brand-container">
                <h1 class="main-logo">wareligent</h1>
                <p class="sub-text">Search the web intelligently</p>
            </div>

            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off">
                    <button id="clearBtn" class="action-btn" style="display: none;">✕</button>
                    <button id="voiceBtn" class="action-btn" title="Voice Search">🎙️</button>
                </div>
                <ul id="suggestionsList" class="suggestions-box"></ul>
            </div>

            <div class="category-tabs" id="categoryTabs" style="display: none;">
                <button class="tab-chip active" data-type="all">All</button>
                <button class="tab-chip" data-type="images">Images</button>
                <button class="tab-chip" data-type="news">News</button>
                <button class="tab-chip" data-type="videos">Videos</button>
            </div>

            <section class="trending-box" id="trendingBox">
                <div class="trending-header">
                    <span>🕒 SEARCH HISTORY</span>
                </div>
                <div class="trending-grid" id="trendingGrid"></div>
            </section>

            <!-- Search meta information (Time & Results count) -->
            <div id="searchPerfMeta" class="search-perf-meta"></div>

            <div id="resultsWrapper" class="results-container"></div>
            
            <!-- Load More Container -->
            <div id="loadMoreContainer" class="load-more-container" style="display: none;">
                <button id="loadMoreBtn" class="load-more-btn">Load More Results</button>
            </div>
        </main>

        <footer class="footer-container">
            <p>&copy; 2026 Wareligent. All rights reserved. | <a href="https://about-wareligent.vercel.app" target="_blank" rel="noopener noreferrer">ABOUT US</a></p>
        </footer>
    </div>

    <!-- Modals -->
    <div id="deleteModalOverlay" class="delete-modal-overlay" style="display: none;">
        <div class="delete-modal">
            <p id="deleteModalText">Delete this item from history?</p>
            <div style="display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end;">
                <button id="cancelDeleteBtn" style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); cursor: pointer;">Cancel</button>
                <button id="confirmDeleteBtn" style="padding: 6px 12px; border-radius: 6px; border: none; background: #ef4444; color: white; cursor: pointer;">Delete</button>
            </div>
        </div>
    </div>

    <div id="authModalOverlay" class="delete-modal-overlay" style="display: none;">
        <div class="delete-modal">
            <div id="loggedOutView">
                <h3 style="margin-bottom: 6px; text-align: center;">Account Login / Signup</h3>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; text-align: center;">Save search history across all devices.</p>

                <input type="email" id="authEmail" class="auth-input" placeholder="Enter email" autocomplete="off">
                <input type="password" id="authPassword" class="auth-input" placeholder="Enter password" autocomplete="off">

                <div style="display: flex; gap: 8px; margin-top: 4px;">
                    <button id="loginBtn" style="flex: 1; padding: 8px; background: var(--accent-color); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Login</button>
                    <button id="signupBtn" style="flex: 1; padding: 8px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Sign Up</button>
                </div>
            </div>

            <div id="loggedInView" style="display: none; text-align: center;">
                <h3 style="margin-bottom: 6px;">Profile Account</h3>
                <p style="font-size: 0.8rem; color: var(--text-secondary);">Logged in as:</p>
                <p id="loggedInUserEmail" style="font-size: 0.9rem; color: var(--accent-color); margin-bottom: 16px; font-weight: 700; word-break: break-all;"></p>

                <button id="logoutBtn" style="width: 100%; padding: 8px; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Logout</button>
            </div>

            <div style="text-align: center; margin-top: 12px;">
                <button id="closeAuthModal" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; text-decoration: underline; font-size: 0.8rem;">Close</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xveccsbdrysuiwyuvodw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let targetDeleteId = null;
        let currentSearchQuery = "";
        let currentSearchCategory = "all";
        let currentUser = null;

        // --- Pagination Variables ---
        let currentPage = 0;
        const PAGE_SIZE = 5;

        // --- Keyword Highlighting Function ---
        function highlightText(text, keyword) {
            if (!text || !keyword) return text || '';
            const regex = new RegExp(`(${keyword.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<mark class="highlight">$1</mark>');
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateUIForUser(session ? session.user : null);

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                updateUIForUser(session ? session.user : null);
                loadTrendingTopics();
            });
        }

        function updateUIForUser(user) {
            currentUser = user;
            const userStatusText = document.getElementById('userStatusText');
            const loggedOutView = document.getElementById('loggedOutView');
            const loggedInView = document.getElementById('loggedInView');
            const loggedInUserEmail = document.getElementById('loggedInUserEmail');

            if (user) {
                userStatusText.textContent = user.email.split('@')[0];
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'block';
                loggedInUserEmail.textContent = user.email;
            } else {
                userStatusText.textContent = 'Guest';
                loggedOutView.style.display = 'block';
                loggedInView.style.display = 'none';
            }
        }

        const authModalOverlay = document.getElementById('authModalOverlay');
        document.getElementById('profileBtn').addEventListener('click', () => { authModalOverlay.style.display = 'flex'; });
        document.getElementById('closeAuthModal').addEventListener('click', () => { authModalOverlay.style.display = 'none'; });

        document.getElementById('signupBtn').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!email || !password) return alert('Please enter email and password');

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert(error.message);
            else {
                const { error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (loginError) alert('Signup successful! Check email.');
                else {
                    alert('Account created & logged in!');
                    authModalOverlay.style.display = 'none';
                }
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!email || !password) return alert('Please enter email and password');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else authModalOverlay.style.display = 'none';
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            authModalOverlay.style.display = 'none';
        });

        async function loadTrendingTopics() {
            const trendingGrid = document.getElementById('trendingGrid');
            if (!trendingGrid) return;

            try {
                let query = supabaseClient.from('search_suggestions').select('id, keyword').order('created_at', { ascending: false }).limit(7);
                if (currentUser) query = query.eq('user_id', currentUser.id);
                else query = query.is('user_id', null);

                const { data, error } = await query;
                if (error) return;

                trendingGrid.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach((item, index) => {
                        const trendItem = document.createElement('div');
                        trendItem.className = 'trend-item';
                        trendItem.dataset.query = item.keyword;
                        trendItem.dataset.id = item.id;
                        trendItem.innerHTML = `<span class="trend-no">${String(index + 1).padStart(2, '0')}</span><span class="trend-text">${item.keyword}</span>`;

                        let pressTimer;
                        let isLongPress = false;

                        const startPress = () => {
                            isLongPress = false;
                            pressTimer = setTimeout(() => {
                                isLongPress = true;
                                showDeleteModal(item.id, item.keyword);
                            }, 600);
                        };

                        const cancelPress = () => clearTimeout(pressTimer);

                        trendItem.addEventListener('touchstart', startPress);
                        trendItem.addEventListener('touchend', cancelPress);
                        trendItem.addEventListener('touchmove', cancelPress);
                        trendItem.addEventListener('mousedown', startPress);
                        trendItem.addEventListener('mouseup', cancelPress);
                        trendItem.addEventListener('mouseleave', cancelPress);

                        trendItem.addEventListener('click', function() {
                            if (isLongPress) return;
                            searchInput.value = this.dataset.query;
                            clearBtn.style.display = 'block';
                            executeSearch(this.dataset.query);
                        });

                        trendingGrid.appendChild(trendItem);
                    });
                } else {
                    trendingGrid.innerHTML = `<p style="font-size: 0.82rem; color: var(--text-secondary); padding: 6px 0;">No search history found.</p>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function showDeleteModal(id, keyword) {
            targetDeleteId = id;
            document.getElementById('deleteModalText').innerHTML = `Delete "<strong>${keyword}</strong>" from history?`;
            document.getElementById('deleteModalOverlay').style.display = 'flex';
        }

        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            document.getElementById('deleteModalOverlay').style.display = 'none';
            targetDeleteId = null;
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!targetDeleteId) return;
            try {
                const { error } = await supabaseClient.from('search_suggestions').delete().eq('id', targetDeleteId);
                if (!error) {
                    document.getElementById('deleteModalOverlay').style.display = 'none';
                    targetDeleteId = null;
                    loadTrendingTopics();
                }
            } catch (err) {
                console.error(err);
            }
        });

        async function saveSearchWordToDatabase(word) {
            if (!word) return;
            const cleanWord = word.trim().toLowerCase();
            if (!cleanWord || cleanWord.length < 2) return;

            try {
                const payload = {
                    keyword: cleanWord,
                    created_at: new Date().toISOString(),
                    user_id: currentUser ? currentUser.id : null
                };

                let checkQuery = supabaseClient.from("search_suggestions").select("id").eq("keyword", cleanWord);
                if (currentUser) checkQuery = checkQuery.eq("user_id", currentUser.id);
                else checkQuery = checkQuery.is("user_id", null);

                const { data } = await checkQuery.maybeSingle();

                if (data) {
                    await supabaseClient.from("search_suggestions").update({ created_at: new Date().toISOString() }).eq("id", data.id);
                } else {
                    await supabaseClient.from("search_suggestions").insert([payload]);
                }

                let historyQuery = supabaseClient.from("search_suggestions").select("id").order("created_at", { ascending: false });
                if (currentUser) historyQuery = historyQuery.eq("user_id", currentUser.id);
                else historyQuery = historyQuery.is("user_id", null);

                const { data: allHistory } = await historyQuery;
                if (allHistory && allHistory.length > 7) {
                    const idsToDelete = allHistory.slice(7).map(item => item.id);
                    await supabaseClient.from("search_suggestions").delete().in("id", idsToDelete);
                }
            } catch (err) {
                console.error(err);
            }
        }

        const searchInput = document.getElementById('searchInput');
        const suggestionsList = document.getElementById('suggestionsList');
        const resultsWrapper = document.getElementById('resultsWrapper');
        const trendingBox = document.getElementById('trendingBox');
        const categoryTabs = document.getElementById('categoryTabs');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const clearBtn = document.getElementById('clearBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const searchPerfMeta = document.getElementById('searchPerfMeta');

        let debounceTimer;

        document.addEventListener('DOMContentLoaded', () => { checkUserSession(); });

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            document.body.classList.toggle('light-theme');
            themeIcon.textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        });

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query ? 'block' : 'none';

            if (!query) {
                suggestionsList.innerHTML = '';
                return;
            }

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => { fetchSuggestions(query); }, 200);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsList.innerHTML = '';
            resultsWrapper.innerHTML = '';
            searchPerfMeta.style.display = 'none';
            loadMoreContainer.style.display = 'none';
            categoryTabs.style.display = 'none';
            trendingBox.style.display = 'block';
            currentSearchQuery = "";
            currentPage = 0;
            resetCategoryTabs();
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') executeSearch();
        });

        function fetchSuggestions(query) {
            const oldScript = document.getElementById('jsonp-suggestions');
            if (oldScript) oldScript.remove();

            window.handleGoogleSuggestions = function(data) {
                const suggestions = (data && data[1]) ? data[1] : [];
                renderSuggestions(suggestions);
            };

            const script = document.createElement('script');
            script.id = 'jsonp-suggestions';
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleGoogleSuggestions`;
            document.body.appendChild(script);
        }

        function renderSuggestions(suggestions) {
            suggestionsList.innerHTML = '';
            if (suggestions.length === 0) return;

            suggestions.slice(0, 5).forEach((term) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>🔍</span> ${term}`;
                li.onclick = () => {
                    searchInput.value = term;
                    suggestionsList.innerHTML = '';
                    executeSearch(term);
                };
                suggestionsList.appendChild(li);
            });
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            voiceBtn.addEventListener('click', () => {
                recognition.start();
                voiceBtn.style.color = '#ef4444';
            });

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                searchInput.value = transcript;
                voiceBtn.style.color = '';
                executeSearch(transcript);
            };

            recognition.onend = () => { voiceBtn.style.color = ''; };
        }

        const tabChips = document.querySelectorAll('.tab-chip');
        tabChips.forEach(chip => {
            chip.addEventListener('click', function() {
                const type = this.dataset.type;
                tabChips.forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                currentSearchCategory = type;

                if (currentSearchQuery) renderCategoryResults(currentSearchQuery, type);
            });
        });

        function resetCategoryTabs() {
            currentSearchCategory = "all";
            tabChips.forEach(c => {
                if (c.dataset.type === "all") c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        async function renderCategoryResults(query, type) {
            loadMoreContainer.style.display = 'none';
            searchPerfMeta.style.display = 'none';

            if (type === "all") {
                currentPage = 0;
                executeSearch(query, false);
            } else if (type === "images") {
                resultsWrapper.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Loading images...</p>`;
                try {
                    const response = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&prop=pageimages&piprop=thumbnail&pithumbsize=400&gsrsearch=${encodeURIComponent(query)}&gsrlimit=12&format=json&origin=*`);
                    const data = await response.json();
                    
                    resultsWrapper.innerHTML = '';
                    const mediaGrid = document.createElement('div');
                    mediaGrid.className = 'media-grid';

                    if (data.query && data.query.pages) {
                        const pages = Object.values(data.query.pages);
                        let count = 0;
                        pages.forEach(page => {
                            if (page.thumbnail && page.thumbnail.source) {
                                count++;
                                const card = document.createElement('div');
                                card.className = 'media-card';
                                card.innerHTML = `<img src="${page.thumbnail.source}" alt="${page.title}"><div class="media-title">${page.title.replace("File:", "")}</div>`;
                                card.onclick = () => window.open(page.thumbnail.source, '_blank');
                                mediaGrid.appendChild(card);
                            }
                        });
                        if (count > 0) resultsWrapper.appendChild(mediaGrid);
                        else resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px;">No images found.</p>`;
                    } else resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px;">No images found.</p>`;
                } catch(e) {
                    resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px;">Failed to load images.</p>`;
                }

            } else if (type === "news") {
                resultsWrapper.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Loading news...</p>`;
                try {
                    const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
                    const data = await res.json();
                    resultsWrapper.innerHTML = '';
                    if (data.query && data.query.search.length > 0) {
                        data.query.search.forEach(item => {
                            const highlightedTitle = highlightText(item.title, query);
                            const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                            const highlightedSnippet = highlightText(cleanSnippet, query);

                            const card = document.createElement('div');
                            card.className = 'result-card';
                            card.innerHTML = `
                                <div class="result-header"><span class="site-url">wikipedia.org</span></div>
                                <a class="result-title" target="_blank" href="https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}">${highlightedTitle}</a>
                                <p class="result-snippet">${highlightedSnippet}...</p>
                            `;
                            resultsWrapper.appendChild(card);
                        });
                    } else resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px;">No news found.</p>`;
                } catch(e) {
                    resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px;">Failed to load news.</p>`;
                }

            } else if (type === "videos") {
                resultsWrapper.innerHTML = `
                    <div class="video-box">
                        <iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}" allowfullscreen></iframe>
                    </div>
                    <div style="text-align: center; margin-top: 10px;">
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(query)}" target="_blank" style="display: inline-block; background: #ff0000; color: #fff; padding: 6px 14px; border-radius: 16px; font-weight: 600; text-decoration: none; font-size: 13px;">▶ Watch on YouTube</a>
                    </div>
                `;
            }
        }

        async function executeSearch(queryStr, saveToHistory = true, isLoadMore = false) {
            const query = (typeof queryStr === 'string' && queryStr.trim() !== '') ? queryStr.trim() : searchInput.value.trim();
            suggestionsList.innerHTML = '';
            if (!query) return;

            const cleanQuery = query.trim().toLowerCase();
            currentSearchQuery = cleanQuery;

            if (!isLoadMore) {
                currentPage = 0;
                searchPerfMeta.style.display = 'none';
            }

            if (saveToHistory && !isLoadMore) {
                await saveSearchWordToDatabase(cleanQuery);
                loadTrendingTopics();
                resetCategoryTabs();
            }

            trendingBox.style.display = 'none';
            categoryTabs.style.display = 'flex';

            if (currentSearchCategory !== "all") {
                renderCategoryResults(cleanQuery, currentSearchCategory);
                return;
            }

            if (!isLoadMore) {
                resultsWrapper.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Searching for "${query}"...</p>`;
            } else {
                loadMoreBtn.textContent = 'Loading...';
            }

            const startTime = performance.now();

            try {
                const from = currentPage * PAGE_SIZE;
                const to = from + PAGE_SIZE - 1;

                const { data: searchResults, error, count } = await supabaseClient
                    .from('websites')
                    .select('*', { count: 'exact' })
                    .or(`title.ilike.%${cleanQuery}%,keywords.ilike.%${cleanQuery}%,description.ilike.%${cleanQuery}%`)
                    .range(from, to);

                if (error) throw error;

                const endTime = performance.now();
                const timeTakenSeconds = ((endTime - startTime) / 1000).toFixed(2);

                if (!isLoadMore) {
                    resultsWrapper.innerHTML = '';
                    
                    if (count > 0) {
                        searchPerfMeta.textContent = `About ${count} results found in ${timeTakenSeconds} seconds.`;
                        searchPerfMeta.style.display = 'block';
                    } else {
                        searchPerfMeta.style.display = 'none';
                    }
                }

                if (searchResults && searchResults.length > 0) {
                    searchResults.forEach(site => {
                        let targetUrl = site.url ? site.url.trim() : '';
                        if (targetUrl && !targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) targetUrl = 'https://' + targetUrl;

                        let domain = "";
                        try { domain = new URL(targetUrl).hostname; } catch (e) { domain = targetUrl; }

                        // হাইলাইট প্রয়োগ করা হচ্ছে
                        const highlightedTitle = highlightText(site.title, cleanQuery);
                        const highlightedDescription = highlightText(site.description || '', cleanQuery);

                        const card = document.createElement('div');
                        card.className = 'result-card';
                        card.innerHTML = `
                            <div class="result-header">
                                <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" class="site-icon" alt="">
                                <span class="site-url">${domain}</span>
                            </div>
                            <a href="${targetUrl}" target="_blank" class="result-title">${highlightedTitle}</a>
                            <p class="result-snippet">${highlightedDescription}</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });

                    if (from + searchResults.length < count) {
                        loadMoreContainer.style.display = 'block';
                        loadMoreBtn.textContent = 'Load More Results';
                    } else {
                        loadMoreContainer.style.display = 'none';
                    }

                } else {
                    if (!isLoadMore) {
                        resultsWrapper.innerHTML = `
                            <div class="result-card" style="text-align: center; padding: 20px;">
                                <p style="color: var(--text-secondary); margin-bottom: 10px;">No results found in database.</p>
                                <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" style="display: inline-block; background: var(--accent-color); color: white; padding: 8px 16px; border-radius: 16px; text-decoration: none; font-weight: 600; font-size: 0.9rem;">Search on Google</a>
                            </div>
                        `;
                    }
                    loadMoreContainer.style.display = 'none';
                }
            } catch (err) {
                console.error(err);
                if (!isLoadMore) {
                    resultsWrapper.innerHTML = `<p style="color: #ef4444; text-align: center; padding: 20px;">Error occurred while searching.</p>`;
                }
                loadMoreContainer.style.display = 'none';
                searchPerfMeta.style.display = 'none';
            }
        }

        loadMoreBtn.addEventListener('click', () => {
            currentPage++;
            executeSearch(currentSearchQuery, false, true);
        });
    </script>
</body>
</html>
