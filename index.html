<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#ffffff" />
  <meta
    name="description"
    content="Wareligent — a simple, intelligent search experience."
  />

  <title>Wareligent</title>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Fire / Clear Effect -->
  <div id="fireOverlay" class="fire-overlay"></div>

  <!-- Main App -->
  <div class="app" id="appContainer">

    <!-- Header -->
    <header class="app-header" id="mainHeader">

      <div class="header-spacer"></div>

      <div class="header-actions">

        <!-- Fire / Clear -->
        <button
          class="icon-btn fire-btn"
          id="fireBtn"
          type="button"
          aria-label="Clear search"
          title="Clear search"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13.5.67s-2.58 2.22-2.58 4.77c0 1.25.5 2.39 1.32 3.23-1.82 0-3.29 1.47-3.29 3.29 0 .28.04.55.11.81-1.02-.68-1.7-1.84-1.7-3.16 0-.25.02-.49.07-.73-2.25 1.58-3.73 4.14-3.73 7.05 0 4.8 3.89 8.69 8.69 8.69s8.69-3.89 8.69-8.69c0-5.83-4.38-10.63-7.58-15.26z"/>
          </svg>
        </button>

        <!-- Tabs -->
        <button
          class="tab-badge"
          id="tabCountBtn"
          type="button"
          aria-label="Open tabs"
          title="Tabs"
        >
          1
        </button>

        <!-- Menu -->
        <button
          class="icon-btn"
          id="menuBtn"
          type="button"
          aria-label="Open settings"
          title="Menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>

      </div>
    </header>


    <!-- Main -->
    <main class="main-content">

      <section class="search-area">

        <!-- Brand -->
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <h1 id="brandTitle">Wareligent</h1>

          <p>Search the web intelligently.</p>
        </div>


        <!-- Search -->
        <div
          class="search-box"
          id="searchBar"
          role="search"
        >

          <!-- Back -->
          <button
            class="back-btn"
            id="backBtn"
            type="button"
            aria-label="Exit search"
            title="Back"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11H7.83l5.59-5.59L12 4l-1.41 1.41L17.17 13H20v-2z"/>
            </svg>
          </button>


          <!-- Search Icon -->
          <svg
            class="search-icon"
            id="searchIcon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>


          <!-- Input -->
          <input
            id="searchInput"
            type="text"
            placeholder="Search Wareligent or type a URL"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="search"
            aria-label="Search"
          />


          <!-- Clear -->
          <button
            class="clear-btn"
            id="clearBtn"
            type="button"
            aria-label="Clear"
            title="Clear"
          >
            <span></span>
          </button>


          <!-- AI -->
          <button
            class="ai-btn"
            id="aiSparkBtn"
            type="button"
            aria-label="AI Search"
            title="AI Search"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2zm6.5 12.5.8 2.7 2.7.8-2.7.8-.8 2.7-.8-2.7-2.7-.8 2.7-.8.8-2.7z"/>
            </svg>
          </button>

        </div>


        <!-- Quick hint -->
        <div class="search-hint">
          <span>Press</span>
          <kbd>Enter</kbd>
          <span>to search</span>
        </div>

      </section>

    </main>


    <!-- Footer -->
    <footer class="app-footer">
      <span>Wareligent</span>
      <span class="footer-dot">•</span>
      <span>Intelligent Search</span>
    </footer>

  </div>


  <!-- Settings Drawer -->
  <div
    class="menu-modal"
    id="menuModal"
    aria-hidden="true"
  >

    <div
      class="menu-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >

      <div class="menu-header">
        <div>
          <span class="menu-eyebrow">WARELIGENT</span>
          <h2 id="settingsTitle">Settings</h2>
        </div>

        <button
          id="closeMenuBtn"
          class="close-btn"
          type="button"
          aria-label="Close settings"
        >
          &times;
        </button>
      </div>


      <div class="menu-body">

        <!-- Theme -->
        <button
          id="themeToggleBtn"
          class="menu-item"
          type="button"
        >
          <div class="menu-item-left">
            <span class="menu-icon">☾</span>

            <div>
              <strong>Dark Theme</strong>
              <small>Change appearance</small>
            </div>
          </div>

          <span id="themeStatus" class="status-pill">Off</span>
        </button>


        <!-- About -->
        <a
          href="https://about-wareligent.vercel.app"
          class="menu-item"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="menu-item-left">
            <span class="menu-icon">i</span>

            <div>
              <strong>About Wareligent</strong>
              <small>Learn more about the project</small>
            </div>
          </div>

          <span class="arrow">→</span>
        </a>

      </div>


      <div class="menu-footer">
        Wareligent Search Engine
      </div>

    </div>
  </div>


  <!-- Small Toast -->
  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>

</body>
</html>
