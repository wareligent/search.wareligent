<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wareligent</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Overlay for Flash effect -->
  <div id="fireOverlay" class="fire-overlay"></div>

  <div class="ddg-container" id="appContainer">

    <!-- Header Action Bar -->
    <header class="ddg-header" id="mainHeader">
      <div class="header-left"></div>

      <div class="header-actions">
        <!-- Fire Button -->
        <button class="action-btn fire-btn" id="fireBtn" title="Clear Tabs & Data">
          <svg viewBox="0 0 24 24"><path d="M13.5 0.67c0 0-2.58 2.22-2.58 4.77 0 1.25.5 2.39 1.32 3.23 -1.82 0-3.29 1.47-3.29 3.29 0 .28.04.55.11.81 -1.02-.68-1.7-1.84-1.7-3.16 0-.25.02-.49.07-.73 -2.25 1.58-3.73 4.14-3.73 7.05 0 4.8 3.89 8.69 8.69 8.69s8.69-3.89 8.69-8.69c0-5.83-4.38-10.63-7.58-15.26z"/></svg>
        </button>
        <!-- Tab Count -->
        <button class="action-btn tab-badge" id="tabCountBtn">1</button>
        <!-- Menu Hamburger Icon -->
        <button class="action-btn" id="menuBtn" title="Menu">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Section -->
    <main class="ddg-main">
      <div class="brand-search-wrapper">
        <!-- Wareligent Title -->
        <h1 class="brand-title" id="brandTitle">Wareligent</h1>

        <!-- Search Bar -->
        <div class="google-search-bar" id="searchBar">
          <!-- Back Arrow (Focus Mode-এ দেখাবে) -->
          <button class="back-btn" id="backBtn" title="Back">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </button>

          <!-- Search Lens Icon -->
          <svg class="search-icon" id="searchIcon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>

          <input type="text" id="searchInput" placeholder="Search Wareligent or type a URL" autocomplete="off" />

          <!-- AI Spark / Chat Icon -->
          <button class="ai-spark-btn" id="aiSparkBtn" title="AI Search">
            <svg viewBox="0 0 24 24"><path d="M12 2L9.19 8.63 2 12l7.19 3.37L12 22l2.81-6.63L22 12l-7.19-3.37z"/></svg>
          </button>
        </div>
      </div>
    </main>

  </div>

  <!-- Settings Menu Drawer -->
  <div id="menuModal" class="menu-modal">
    <div class="menu-content">
      <div class="menu-header">
        <h3>Settings</h3>
        <button id="closeMenuBtn" class="close-btn">&times;</button>
      </div>
      <div class="menu-body">
        <button id="themeToggleBtn" class="menu-item">
          <span>Dark Theme</span>
          <span id="themeStatus">Off</span>
        </button>
        <a href="https://about-wareligent.vercel.app" class="menu-item" target="_blank" rel="noopener">
          <span>About Wareligent</span>
          <span>&rarr;</span>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
