<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <!-- Supabase Official SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .delete-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .delete-modal {
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #e5e7eb);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .delete-modal p {
            font-size: 0.95rem;
            color: var(--text-primary, #1f2937);
            margin-bottom: 18px;
            word-break: break-word;
        }

        .delete-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .delete-modal-actions button {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-cancel {
            background: var(--bg-color, #f9fafb);
            color: var(--text-primary, #1f2937);
            border: 1px solid var(--border-color, #e5e7eb) !important;
        }

        .btn-confirm-delete {
            background: #ef4444;
            color: #ffffff;
        }
    </style>
</head>
<body class="light-theme">
    <div class="wrapper">
        <!-- হেডার -->
        <header class="navbar">
            <div class="nav-brand">wareligent<span>.search</span></div>
            <div class="nav-actions">
                <button id="themeToggleBtn" class="theme-btn" title="Toggle Theme">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </header>

        <main class="content-area">
            <!-- ব্র্যান্ড লোগো -->
            <div class="brand-container">
                <h1 class="main-logo">wareligent</h1>
                <p class="sub-text">Search the web intelligently</p>
            </div>

            <!-- আপনার নিজস্ব সার্চ বক্স -->
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off">
                    <button id="clearBtn" class="action-btn" style="display: none;">✕</button>
                    <button id="voiceBtn" class="action-btn" title="Voice Search">🎙️</button>
                </div>
                <ul id="suggestionsList" class="suggestions-box"></ul>
            </div>

            <!-- সার্চ হিস্ট্রি -->
            <section class="trending-box" id="trendingBox">
                <div class="trending-header">
                    <span>🕒 SEARCH HISTORY</span>
                </div>
                <div class="trending-grid" id="trendingGrid"></div>
            </section>
        </main>

        <!-- ফুটার -->
        <footer class="footer-container">
            <p>&copy; 2026 Wareligent. All rights reserved. | <a href="https://about-wareligent.vercel.app" target="_blank" rel="noopener noreferrer">ABOUT US</a></p>
        </footer>
    </div>

    <!-- ডিলিট মোডাল -->
    <div id="deleteModalOverlay" class="delete-modal-overlay" style="display: none;">
        <div class="delete-modal">
            <p id="deleteModalText">Delete this item from history?</p>
            <div class="delete-modal-actions">
                <button class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
                <button class="btn-confirm-delete" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xveccsbdrysuiwyuvodw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let targetDeleteId = null;

        async function loadTrendingTopics() {
            const trendingGrid = document.getElementById('trendingGrid');
            if (!trendingGrid) return;

            try {
                const { data, error } = await supabaseClient
                    .from('search_suggestions')
                    .select('id, keyword, search_count')
                    .order('search_count', { ascending: false })
                    .limit(7);

                if (error) return;

                trendingGrid.innerHTML = '';

                if (data && data.length > 0) {
                    data.forEach((item, index) => {
                        const trendItem = document.createElement('div');
                        trendItem.className = 'trend-item';
                        trendItem.dataset.query = item.keyword;
                        trendItem.dataset.id = item.id;

                        const numberFormatted = String(index + 1).padStart(2, '0');

                        trendItem.innerHTML = `
                            <span class="trend-no">${numberFormatted}</span>
                            <span class="trend-text">${item.keyword}</span>
                        `;

                        let pressTimer;
                        let isLongPress = false;

                        const startPress = () => {
                            isLongPress = false;
                            pressTimer = setTimeout(() => {
                                isLongPress = true;
                                showDeleteModal(item.id, item.keyword);
                            }, 600);
                        };

                        const cancelPress = () => clearTimeout(pressTimer);

                        trendItem.addEventListener('touchstart', startPress);
                        trendItem.addEventListener('touchend', cancelPress);
                        trendItem.addEventListener('touchmove', cancelPress);

                        trendItem.addEventListener('mousedown', startPress);
                        trendItem.addEventListener('mouseup', cancelPress);
                        trendItem.addEventListener('mouseleave', cancelPress);

                        trendItem.addEventListener('click', function(e) {
                            if (isLongPress) return;
                            const query = this.dataset.query;
                            searchInput.value = query;
                            clearBtn.style.display = 'block';
                            executeSearch(query);
                        });

                        trendingGrid.appendChild(trendItem);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        function showDeleteModal(id, keyword) {
            targetDeleteId = id;
            document.getElementById('deleteModalText').innerHTML = `Delete "<strong>${keyword}</strong>" from history?`;
            document.getElementById('deleteModalOverlay').style.display = 'flex';
        }

        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            document.getElementById('deleteModalOverlay').style.display = 'none';
            targetDeleteId = null;
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!targetDeleteId) return;

            try {
                const { error } = await supabaseClient
                    .from('search_suggestions')
                    .delete()
                    .eq('id', targetDeleteId);

                if (!error) {
                    document.getElementById('deleteModalOverlay').style.display = 'none';
                    targetDeleteId = null;
                    loadTrendingTopics();
                }
            } catch (err) {
                console.error(err);
            }
        });

        async function saveSearchWordToDatabase(word) {
            if (!word) return;
            const cleanWord = word.trim().toLowerCase();
            if (!cleanWord || cleanWord.length < 2) return;

            try {
                const { data } = await supabaseClient
                    .from("search_suggestions")
                    .select("id, search_count")
                    .eq("keyword", cleanWord)
                    .maybeSingle();

                if (data) {
                    await supabaseClient
                        .from("search_suggestions")
                        .update({ search_count: (data.search_count || 1) + 1 })
                        .eq("id", data.id);
                } else {
                    await supabaseClient
                        .from("search_suggestions")
                        .insert([{ keyword: cleanWord, search_count: 1 }]);
                }
            } catch (err) {
                console.error(err);
            }
        }

        const searchInput = document.getElementById('searchInput');
        const suggestionsList = document.getElementById('suggestionsList');
        const trendingBox = document.getElementById('trendingBox');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const clearBtn = document.getElementById('clearBtn');
        const voiceBtn = document.getElementById('voiceBtn');

        let debounceTimer;

        document.addEventListener('DOMContentLoaded', loadTrendingTopics);

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            document.body.classList.toggle('light-theme');
            themeIcon.textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        });

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query ? 'block' : 'none';

            if (!query) {
                suggestionsList.innerHTML = '';
                return;
            }

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                fetchSuggestions(query);
            }, 200);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsList.innerHTML = '';
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });

        function fetchSuggestions(query) {
            const oldScript = document.getElementById('jsonp-suggestions');
            if (oldScript) oldScript.remove();

            window.handleGoogleSuggestions = function(data) {
                const suggestions = (data && data[1]) ? data[1] : [];
                renderSuggestions(suggestions);
            };

            const script = document.createElement('script');
            script.id = 'jsonp-suggestions';
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleGoogleSuggestions`;
            
            document.body.appendChild(script);
        }

        function renderSuggestions(suggestions) {
            suggestionsList.innerHTML = '';
            if (suggestions.length === 0) return;

            suggestions.slice(0, 5).forEach((term) => {
                const li = document.createElement('li');
                li.dataset.val = term;
                li.innerHTML = `<span>🔍</span> ${term}`;
                li.onclick = () => {
                    searchInput.value = term;
                    suggestionsList.innerHTML = '';
                    executeSearch(term);
                };
                suggestionsList.appendChild(li);
            });
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            voiceBtn.addEventListener('click', () => {
                recognition.start();
                voiceBtn.style.color = '#ef4444';
            });

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                searchInput.value = transcript;
                voiceBtn.style.color = '';
                executeSearch(transcript);
            };

            recognition.onend = () => { voiceBtn.style.color = ''; };
        }

        // --- DIRECT SEARCH FUNCTION ---
        async function executeSearch(queryStr) {
            const query = (typeof queryStr === 'string' && queryStr.trim() !== '') ? queryStr.trim() : searchInput.value.trim();
            suggestionsList.innerHTML = '';
            
            if (!query) return;

            await saveSearchWordToDatabase(query);

            const isDomain = /^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/.*)?$/.test(query);
            const hasProtocol = /^https?:\/\//i.test(query);

            if (isDomain || hasProtocol) {
                const finalUrl = hasProtocol ? query : `https://${query}`;
                window.location.href = finalUrl;
            } else {
                // গুগল সার্চ পেজে সরাসরি পাঠাবে কিন্তু ইউজার আপনার ইন্টারফেস ব্যবহার করবে
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }
    </script>
</body>
</html>
