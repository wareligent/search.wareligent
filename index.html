<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Wareligent</title>

  <link rel="stylesheet" href="/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/script.js" defer></script>
</head>

<body>

  <div class="home-app">

    <!-- Header -->
    <header class="home-header">

      <div class="wareligent-logo">
        <span class="logo-mark">W</span>
        <span class="logo-text">Wareligent</span>
      </div>

      <button
        id="themeToggleBtn"
        class="theme-button"
        aria-label="Toggle theme"
      >
        <span id="themeIcon">☾</span>
      </button>

    </header>


    <!-- Main -->
    <main class="home-main">

      <!-- Brand -->
      <section class="hero">

        <div class="hero-logo">
          W
        </div>

        <h1>Wareligent</h1>

        <p>
          Search the web. Discover more.
        </p>

      </section>


      <!-- Search -->
      <section class="home-search-section">

        <button
          id="homeSearchButton"
          class="home-search-bar"
          type="button"
          aria-label="Open search"
        >

          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>

          <span>Search the web</span>

          <span class="search-arrow">→</span>

        </button>

      </section>


      <!-- Weather -->
      <section class="home-section">

        <div class="section-title-row">

          <div>
            <span class="section-icon">☀</span>
            <h2>Weather</h2>
          </div>

          <button
            id="refreshWeatherBtn"
            class="small-action"
            type="button"
          >
            Refresh
          </button>

        </div>

        <div id="weatherCard" class="weather-card">

          <div class="weather-loading">
            Loading weather...
          </div>

        </div>

      </section>


      <!-- News -->
      <section class="home-section">

        <div class="section-title-row">

          <div>
            <span class="section-icon">📰</span>
            <h2>News</h2>
          </div>

          <button
            id="openNewsSearch"
            class="small-action"
            type="button"
          >
            See all
          </button>

        </div>

        <div id="newsList" class="news-list">

          <article class="news-loading">
            Loading latest news...
          </article>

        </div>

      </section>

    </main>


    <!-- Footer -->
    <footer class="home-footer">
      <span>Wareligent Search</span>
      <span>•</span>
      <span>Explore the web</span>
    </footer>

  </div>

</body>
</html>
