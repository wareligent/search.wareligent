<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-solid: #ffffff;
            --text-primary: #1c1e21;
            --text-secondary: #5f6368;
            --border-color: rgba(226, 232, 240, 0.8);
            --accent-color: #0078d4;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        body.dark-theme {
            --card-bg: rgba(20, 26, 38, 0.92);
            --card-solid: #141a26;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(30, 41, 59, 0.8);
            --accent-color: #4f46e5;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Bing Style Wallpaper Background */
            background: linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80') center/cover fixed no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 75px;
        }

        /* Top Bar */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            color: #0078d4;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .content-area {
            padding: 0 16px;
            flex: 1;
        }

        /* Bing Style Pill Search Bar */
        .search-section {
            position: relative;
            margin: 15px 0 20px 0;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--card-solid);
            border-radius: 30px;
            padding: 12px 20px;
            box-shadow: var(--shadow-md);
        }

        .search-icon {
            font-size: 1.2rem;
            margin-right: 12px;
            color: var(--text-secondary);
        }

        #searchInput {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 500;
        }

        .search-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .search-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
        }

        /* Suggestions Box */
        .suggestions-box {
            position: absolute;
            top: 110%;
            left: 0;
            right: 0;
            background: var(--card-solid);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            list-style: none;
            z-index: 100;
            overflow: hidden;
        }

        .suggestions-box li {
            padding: 14px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .suggestions-box li:last-child {
            border-bottom: none;
        }

        /* Horizontal Quick Widgets (Rewards/Creator style) */
        .widgets-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .widgets-scroll::-webkit-scrollbar { display: none; }

        .widget-card {
            min-width: 150px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .widget-title {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .widget-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 6px;
        }

        .widget-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Feed Cards Section */
        .feed-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feed-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feed-source {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .feed-source img {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .feed-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
            text-decoration: none;
        }

        .feed-snippet {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Bottom Floating Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 62px;
            background: var(--card-solid);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 8px;
        }

        .nav-btn.active {
            color: var(--accent-color);
        }

        .center-copilot-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0078d4, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(0, 120, 212, 0.4);
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body class="light-theme">

    <div class="app-container">
        <!-- Header Profile Bar -->
        <header class="app-header">
            <div class="user-avatar" id="themeToggleBtn">👤</div>
        </header>

        <main class="content-area">
            <!-- Bing Style Curved Search Bar -->
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search or ask anything..." autocomplete="off">
                    <div class="search-actions">
                        <button id="clearBtn" style="display:none;" onclick="resetSearch()">✕</button>
                        <span>📷</span>
                        <span>🎙️</span>
                    </div>
                </div>
                <ul id="suggestionsList" class="suggestions-box"></ul>
            </div>

            <!-- Bing Style Horizontal Feature Widgets -->
            <div class="widgets-scroll">
                <div class="widget-card">
                    <span class="widget-title">Wareligent AI</span>
                    <span class="widget-value">Copilot</span>
                    <span class="widget-desc">Smart Answers</span>
                </div>
                <div class="widget-card">
                    <span class="widget-title">Live Web</span>
                    <span class="widget-value">Search</span>
                    <span class="widget-desc">Fast Results</span>
                </div>
                <div class="widget-card">
                    <span class="widget-title">Trending</span>
                    <span class="widget-value">News</span>
                    <span class="widget-desc">Daily Updates</span>
                </div>
            </div>

            <!-- Dynamic Search Feed & Trending Results -->
            <div id="resultsWrapper" class="feed-section"></div>
        </main>

        <!-- Bing Style Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="resetSearch()">🏠</button>
            <button class="nav-btn" onclick="document.getElementById('searchInput').focus()">📷</button>
            <button class="center-copilot-btn" onclick="document.getElementById('searchInput').focus()">✨</button>
            <button class="nav-btn">📋</button>
            <button class="nav-btn">田</button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = "https://xveccsbdrysuiwyuvodw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => { 
            loadTrendingNews();
        });

        // ১. ট্রেন্ডিং পেজ ফিড
        async function loadTrendingNews() {
            const resultsWrapper = document.getElementById('resultsWrapper');
            resultsWrapper.innerHTML = `<p style="color: #ffffff; text-align: center; font-size:0.85rem; padding: 20px;">Loading daily feed...</p>`;
            
            try {
                const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=trending%20news&format=json&origin=*`);
                const data = await res.json();
                resultsWrapper.innerHTML = '';

                if (data.query && data.query.search.length > 0) {
                    data.query.search.slice(0, 6).forEach(item => {
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.innerHTML = `
                            <div class="feed-source">
                                <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=32" alt="">
                                <span>Trending Story</span>
                            </div>
                            <a class="feed-title" href="https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}" target="_blank">${item.title}</a>
                            <p class="feed-snippet">${cleanSnippet}...</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });
                }
            } catch (e) {
                resultsWrapper.innerHTML = `<p style="text-align: center; color: #ffffff;">Could not load news.</p>`;
            }
        }

        // ২. সার্চ সিস্টেম
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestionsList = document.getElementById('suggestionsList');

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query ? 'inline' : 'none';
            if (!query) { suggestionsList.innerHTML = ''; return; }
            fetchSuggestions(query);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                suggestionsList.innerHTML = '';
                executeSearch();
            }
        });

        function resetSearch() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsList.innerHTML = '';
            loadTrendingNews();
        }

        function fetchSuggestions(query) {
            const oldScript = document.getElementById('jsonp-suggestions');
            if (oldScript) oldScript.remove();

            window.handleSuggestions = (data) => {
                suggestionsList.innerHTML = '';
                if (data && data[1]) {
                    data[1].slice(0, 5).forEach((term) => {
                        const li = document.createElement('li');
                        li.innerHTML = `🔍 ${term}`;
                        li.onclick = () => {
                            searchInput.value = term;
                            suggestionsList.innerHTML = '';
                            executeSearch();
                        };
                        suggestionsList.appendChild(li);
                    });
                }
            };

            const script = document.createElement('script');
            script.id = 'jsonp-suggestions';
            script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}&callback=handleSuggestions`;
            document.body.appendChild(script);
        }

        // ৩. In-App Direct Search (No Redirects)
        async function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            const resultsWrapper = document.getElementById('resultsWrapper');
            resultsWrapper.innerHTML = `<p style="text-align: center; padding: 20px; color: #ffffff;">Searching Wareligent Web...</p>`;

            try {
                // Supabase ডেটাবেজ চেক
                let { data: dbResults } = await supabaseClient
                    .from('websites')
                    .select('*')
                    .or(`title.ilike.%${query}%,keywords.ilike.%${query}%,description.ilike.%${query}%`)
                    .limit(6);

                resultsWrapper.innerHTML = '';

                if (dbResults && dbResults.length > 0) {
                    dbResults.forEach(site => {
                        let domain = site.url;
                        try { domain = new URL(site.url).hostname; } catch(e){}

                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.innerHTML = `
                            <div class="feed-source">
                                <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="">
                                <span>${domain}</span>
                            </div>
                            <a href="${site.url}" target="_blank" class="feed-title">${site.title}</a>
                            <p class="feed-snippet">${site.description || ''}</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });
                } else {
                    // Fallback Direct Search Results
                    await fetchLiveWebResults(query);
                }
            } catch (err) {
                await fetchLiveWebResults(query);
            }
        }

        async function fetchLiveWebResults(query) {
            const resultsWrapper = document.getElementById('resultsWrapper');
            try {
                const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
                const data = await res.json();
                resultsWrapper.innerHTML = '';

                if (data.query && data.query.search.length > 0) {
                    data.query.search.forEach(item => {
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const itemUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}`;
                        
                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.innerHTML = `
                            <div class="feed-source">
                                <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=32" alt="">
                                <span>Web Result</span>
                            </div>
                            <a class="feed-title" href="${itemUrl}" target="_blank">${item.title}</a>
                            <p class="feed-snippet">${cleanSnippet}...</p>
                        `;
                        resultsWrapper.appendChild(card);
                    });
                } else {
                    resultsWrapper.innerHTML = `<p style="text-align: center; color: #ffffff; padding: 20px;">No results found for "${query}".</p>`;
                }
            } catch (e) {
                resultsWrapper.innerHTML = `<p style="text-align: center; color: #ffffff; padding: 20px;">Failed to load results.</p>`;
            }
        }

        // থিম টগল
        document.getElementById('themeToggleBtn').onclick = () => {
            document.body.classList.toggle('dark-theme');
        };
    </script>
</body>
</html>
