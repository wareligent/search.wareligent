<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Wareligent Search</title>

  <link rel="stylesheet" href="/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="/script.js" defer></script>
</head>

<body>

  <div class="app">

    <!-- =========================
         HOME HEADER
    ========================== -->

    <header class="home-header">

      <div class="brand">
        <div class="brand-logo">
          W
        </div>

        <div class="brand-name">
          Wareligent
        </div>
      </div>

      <button
        id="themeToggleBtn"
        class="theme-btn"
        type="button"
        aria-label="Toggle theme"
      >
        <span id="themeIcon">☼</span>
      </button>

    </header>


    <!-- =========================
         HOME CONTENT
    ========================== -->

    <main class="home-content">


      <!-- Wareligent Title -->

      <section class="hero">

        <div class="hero-logo">
          W
        </div>

        <h1>
          Wareligent
        </h1>

        <p>
          Search smarter. Discover more.
        </p>

      </section>


      <!-- =========================
           SEARCH
      ========================== -->

      <section class="home-search-section">

        <form
          id="searchForm"
          class="home-search"
        >

          <button
            type="submit"
            class="search-icon-btn"
            aria-label="Search"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle
                cx="11"
                cy="11"
                r="7"
              ></circle>

              <path
                d="M20 20l-4-4"
              ></path>
            </svg>

          </button>


          <input
            id="searchInput"
            type="search"
            placeholder="Search the web..."
            autocomplete="off"
            spellcheck="false"
          />


          <button
            type="button"
            id="clearBtn"
            class="search-action hidden"
            aria-label="Clear search"
          >
            ×
          </button>


          <button
            type="button"
            id="voiceBtn"
            class="search-action"
            aria-label="Voice search"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <rect
                x="9"
                y="3"
                width="6"
                height="12"
                rx="3"
              ></rect>

              <path
                d="M5 11a7 7 0 0 0 14 0"
              ></path>

              <path
                d="M12 18v3"
              ></path>

              <path
                d="M8 21h8"
              ></path>

            </svg>

          </button>


          <button
            type="button"
            id="imageBtn"
            class="search-action"
            aria-label="Search by image"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <rect
                x="3"
                y="5"
                width="18"
                height="15"
                rx="3"
              ></rect>

              <circle
                cx="8.5"
                cy="10"
                r="1.5"
              ></circle>

              <path
                d="M5 17l5-5 3 3 2-2 4 4"
              ></path>

            </svg>

          </button>


          <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
          />

        </form>


        <!-- Search Suggestions -->

        <ul
          id="suggestionsList"
          class="suggestions"
          hidden
        ></ul>

      </section>


      <!-- =========================
           WEATHER
      ========================== -->

      <section class="info-card weather-card">

        <div class="info-card-header">

          <div>
            <span class="info-label">
              Weather
            </span>

            <h2 id="weatherLocation">
              Your location
            </h2>
          </div>

          <span
            id="weatherIcon"
            class="weather-icon"
          >
            ☀️
          </span>

        </div>


        <div
          id="weatherContent"
          class="weather-content"
        >

          <div class="weather-loading">
            Loading weather...
          </div>

        </div>

      </section>


      <!-- =========================
           NEWS
      ========================== -->

      <section class="info-card news-card">

        <div class="info-card-header">

          <div>
            <span class="info-label">
              Latest News
            </span>

            <h2>
              News for you
            </h2>
          </div>


          <button
            id="newsRefresh"
            class="refresh-btn"
            type="button"
            aria-label="Refresh news"
          >
            ↻
          </button>

        </div>


        <div
          id="newsContent"
          class="news-content"
        >

          <div class="news-loading">
            Loading latest news...
          </div>

        </div>

      </section>


    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="home-footer">

      <span>
        Wareligent Search
      </span>

    </footer>


    <!-- Toast -->

    <div
      id="toastContainer"
      class="toast-container"
      aria-live="polite"
    ></div>

  </div>

</body>
</html>
