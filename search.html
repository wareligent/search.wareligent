<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Search — Wareligent</title>

  <link rel="stylesheet" href="search.css">

  <!-- Supabase configuration -->
  <script src="config.js"></script>

  <!-- Search engine -->
  <script src="search.js" defer></script>
</head>

<body>

  <div class="page-transition" id="pageTransition"></div>

  <header class="search-header">

    <div class="header-left">

      <a href="/" class="mini-brand" id="homeLogo">

        <div class="mini-mark">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <span>Wareligent</span>

      </a>

    </div>


    <div class="header-center">

      <form class="search-form" id="searchForm">

        <button
          type="button"
          class="mobile-home-btn"
          id="mobileHomeBtn"
          aria-label="Home"
        >
          ←
        </button>

        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5a6.5 6.5 0 1 0-6.5 6.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>

        <input
          id="searchInput"
          type="search"
          placeholder="Search the web"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >

        <button
          type="button"
          class="clear-btn"
          id="clearBtn"
          aria-label="Clear"
        >
          ×
        </button>

        <button
          type="submit"
          class="search-submit"
          aria-label="Search"
        >
          <svg viewBox="0 0 24 24">
            <path d="M9.5 3a6.5 6.5 0 0 0 0 13c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5-.79-.79h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 0 0 9.5 3zm0 2C11.99 5 14 7.01 14 9.5S11.99 14 9.5 14 5 11.99 5 9.5 7.01 5 9.5 5z"/>
          </svg>
        </button>

      </form>

    </div>


    <div class="header-right">

      <button
        class="settings-btn"
        id="settingsBtn"
        type="button"
        aria-label="Settings"
      >
        <svg viewBox="0 0 24 24">
          <path d="M19.43 12.98c.04-.32.07-.65-.07-.98l2.11-1.65-2-3.46-2.49 1a7.8 7.8 0 0 0-1.69-.98L15 3h-4l-.36 2.53c-.61.25-1.18.58-1.69.98l-2.49-1-2 3.46 2.11 1.65c-.04.32-.08.65-.08.98s.03.66.08.98l-2.11 1.65 2 3.46 2.49-1c.51.4 1.08.73 1.69.98L11 21h4l.36-2.53c.61-.25 1.18-.58 1.69-.98l2.49 1 2.49 1 2-3.46-2.11-1.65zM13 15.5A3.5 3.5 0 1 1 13 8a3.5 3.5 0 0 1 0 7.5z"/>
        </svg>
      </button>

    </div>

  </header>


  <main class="results-page">

    <div class="results-top">

      <div>
        <div class="result-label">Search results</div>
        <h1 id="queryTitle"></h1>
      </div>

      <div class="result-count" id="resultCount"></div>

    </div>


    <!-- Loading -->

    <section id="loadingState" class="state loading-state">

      <div class="loader-logo">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p>Searching Wareligent...</p>

    </section>


    <!-- Results -->

    <section id="resultsList" class="results-list"></section>


    <!-- Empty -->

    <section id="emptyState" class="state empty-state hidden">

      <div class="empty-icon">⌕</div>

      <h2>No results found</h2>

      <p>
        Wareligent couldn't find a matching website for this search.
      </p>

      <button id="emptyHomeBtn" type="button">
        Back to Home
      </button>

    </section>


    <!-- Error -->

    <section id="errorState" class="state error-state hidden">

      <div class="error-icon">!</div>

      <h2>Search couldn't be completed</h2>

      <p id="errorMessage">
        Please check your Supabase configuration and try again.
      </p>

      <button id="retryBtn" type="button">
        Try Again
      </button>

    </section>

  </main>


  <!-- Settings -->

  <div
    class="settings-overlay"
    id="settingsOverlay"
    aria-hidden="true"
  >

    <div class="settings-panel">

      <div class="settings-title">

        <span>Settings</span>

        <button id="closeSettings" type="button">
          ×
        </button>

      </div>


      <button
        class="setting-row"
        id="themeToggle"
        type="button"
      >
        <span>Dark mode</span>
        <span id="themeStatus">Off</span>
      </button>


      <a
        class="setting-row"
        href="https://about-wareligent.vercel.app"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>About Wareligent</span>
        <span>→</span>
      </a>


      <button
        class="setting-row"
        id="settingsHomeBtn"
        type="button"
      >
        <span>Home</span>
        <span>→</span>
      </button>

    </div>

  </div>


  <div class="route-loader" id="routeLoader">
    <div class="loader-logo">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

</body>
</html>
